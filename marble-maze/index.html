function resize(){if(!renderer)return;const r=view.getBoundingClientRect();if(r.width<2||r.height<2)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;fitCamera()}
shell.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;drag=true;dragStart={x:e.clientX,y:e.clientY};shell.setPointerCapture?.(e.pointerId)});shell.addEventListener('pointermove',e=>{if(!drag)return;dragTilt.x=Math.max(-1,Math.min(1,(e.clientX-dragStart.x)/95));dragTilt.z=Math.max(-1,Math.min(1,(e.clientY-dragStart.y)/95))});const endDrag=()=>{drag=false;dragTilt.x=dragTilt.z=0};shell.addEventListener('pointerup',endDrag);shell.addEventListener('pointercancel',endDrag);
async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('denied')}if(!orientationBound){window.addEventListener('deviceorientation',e=>{if(!deviceTilt)return;if(baseBeta===null){baseBeta=e.beta||0;baseGamma=e.gamma||0}tilt.x=Math.max(-1,Math.min(1,((e.gamma||0)-baseGamma)/14));tilt.z=Math.max(-1,Math.min(1,((e.beta||0)-baseBeta)/14))});orientationBound=true}baseBeta=baseGamma=null;deviceTilt=true;tiltBtn.textContent='傾き操作 ON ✓';statusEl.textContent='TILT READY';ballBody?.wakeUp();flash('TILT READY')}catch{deviceTilt=false;tiltBtn.textContent='指操作 MODE';statusEl.textContent='DRAG MODE';flash('DRAG MODE')}}
tiltBtn.addEventListener('click',enableTilt);retryBtn.addEventListener('click',()=>resetBall());newBtn.addEventListener('click',()=>{seed=randomSeed();buildWorld();flash('NEW MAZE')});diffBtns.forEach(b=>b.addEventListener('click',()=>{difficulty=b.dataset.diff;diffBtns.forEach(x=>x.classList.toggle('active',x===b));seed=randomSeed();buildWorld();flash(`${CONFIG[difficulty].label} MAZE`)}));window.addEventListener('resize',resize);new ResizeObserver(resize).observe(view);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<320)e.preventDefault();lt=n},{passive:false});
buildWorld();loading.classList.add('hidden');requestAnimationFrame(loop);
</script>
