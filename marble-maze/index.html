<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#d5b77a" />
  <title>Marble Maze</title>
  <style>
    :root{font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;color-scheme:light}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#c6a96b;touch-action:none}
    body{display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:radial-gradient(circle at 30% 0%,#ead9ae 0 10%,transparent 38%),linear-gradient(160deg,#b99656,#d7bd83 55%,#a9874d)}
    .toy{width:min(100%,440px);height:100%;max-height:820px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px;border-radius:30px;background:#d7b875;border:3px solid #8b692f;box-shadow:inset 0 2px #f7e8c1,inset 0 -8px 18px rgba(76,48,12,.18),0 18px 50px rgba(72,45,12,.32)}
    .top{display:grid;grid-template-columns:44px 1fr 84px;align-items:center;gap:8px;color:#4d3719}
    .back,.reset,.tilt{border:2px solid #8b692f;background:#f0d796;color:#4d3719;border-radius:14px;min-height:42px;font:800 13px inherit;text-decoration:none;display:grid;place-items:center;box-shadow:inset 0 2px #fff2c9,0 3px 0 #8b692f}
    .back:active,.reset:active,.tilt:active{transform:translateY(2px);box-shadow:inset 0 1px #fff2c9,0 1px 0 #8b692f}
    .title{text-align:center;min-width:0}.title b{display:block;font-size:18px;letter-spacing:.04em}.title span{display:block;font-size:10px;opacity:.65;margin-top:2px}
    .board-wrap{min-height:0;display:grid;place-items:center;padding:4px}
    .board{position:relative;width:min(100%,390px);aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:#efe4bd;border:4px solid #765526;box-shadow:inset 0 0 0 5px #b88c47,inset 0 10px 24px rgba(255,255,255,.55),0 8px 18px rgba(82,50,14,.26);touch-action:none}
    canvas{display:block;width:100%;height:100%}
    .help{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;color:#4d3719;font-size:11px;line-height:1.35}.help small{opacity:.7}.tilt{padding:0 12px;white-space:nowrap}
    .status{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2;padding:6px 10px;border-radius:999px;background:rgba(255,248,224,.84);border:1px solid rgba(92,62,25,.28);font:900 11px ui-monospace,monospace;color:#5c3d17;backdrop-filter:blur(6px);pointer-events:none}
    @media(max-height:650px){.toy{gap:6px;padding:8px}.top{grid-template-columns:40px 1fr 76px}.back,.reset,.tilt{min-height:36px}.title b{font-size:15px}.help{font-size:10px}}
  </style>
</head>
<body>
  <main class="toy">
    <div class="top">
      <a class="back" href="../" aria-label="戻る">‹</a>
      <div class="title"><b>MARBLE MAZE</b><span>POCKET SKILL TOY · #06</span></div>
      <button class="reset" id="reset" type="button">RESET</button>
    </div>
    <div class="board-wrap">
      <div class="board" id="board">
        <div class="status" id="status">START → GOAL</div>
        <canvas id="game"></canvas>
      </div>
    </div>
    <div class="help">
      <div><b>傾けて銀玉をGOALへ。</b><br><small>穴に落ちるとSTARTへ。指で盤面をなぞっても傾けられる。</small></div>
      <button class="tilt" id="tilt" type="button">傾き操作 ON</button>
    </div>
  </main>
<script>
(()=>{
  const canvas=document.querySelector('#game');
  const board=document.querySelector('#board');
  const ctx=canvas.getContext('2d');
  const status=document.querySelector('#status');
  const resetBtn=document.querySelector('#reset');
  const tiltBtn=document.querySelector('#tilt');
  let W=0,H=0,dpr=1;
  let tiltX=0,tiltY=0,deviceTilt=false,drag=false,dragStart=null;
  let won=false,falling=0;
  const ball={x:.12,y:.90,vx:0,vy:0,r:.021};
  const start={x:.12,y:.90};
  const goal={x:.88,y:.10,r:.055};
  const holes=[
    {x:.23,y:.22,r:.045},{x:.55,y:.19,r:.045},{x:.80,y:.28,r:.045},
    {x:.36,y:.46,r:.045},{x:.70,y:.52,r:.045},{x:.20,y:.66,r:.045},
    {x:.53,y:.72,r:.045},{x:.82,y:.78,r:.045}
  ];
  const walls=[
    [.05,.78,.42,.78],[.42,.78,.42,.62],[.42,.62,.76,.62],
    [.18,.54,.18,.34],[.18,.34,.48,.34],[.48,.34,.48,.12],
    [.60,.46,.92,.46],[.60,.46,.60,.24],[.72,.88,.72,.68],
    [.05,.14,.30,.14],[.84,.42,.84,.16],[.30,.92,.30,.84]
  ];
  function resize(){
    const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function reset(msg='START → GOAL'){
    ball.x=start.x;ball.y=start.y;ball.vx=0;ball.vy=0;won=false;falling=0;status.textContent=msg;
  }
  function px(x){return x*W} function py(y){return y*H}
  function collideWall(w){
    const [x1,y1,x2,y2]=w;const ax=px(x1),ay=py(y1),bx=px(x2),by=py(y2),cx=px(ball.x),cy=py(ball.y);const rr=ball.r*Math.min(W,H);
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let t=((cx-ax)*dx+(cy-ay)*dy)/l2;t=Math.max(0,Math.min(1,t));const qx=ax+t*dx,qy=ay+t*dy;let nx=cx-qx,ny=cy-qy;const dist=Math.hypot(nx,ny)||.001;
    if(dist<rr+4){nx/=dist;ny/=dist;const push=(rr+4-dist);ball.x+=nx*push/W;ball.y+=ny*push/H;const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.6*vn*nx;ball.vy-=1.6*vn*ny}}
  }
  function update(){
    if(won||falling>0){if(falling>0){falling--;if(!falling)reset('TRY AGAIN')}return}
    const acc=.00042;ball.vx+=tiltX*acc;ball.vy+=tiltY*acc;ball.vx*=.985;ball.vy*=.985;const max=.014;const sp=Math.hypot(ball.vx,ball.vy);if(sp>max){ball.vx*=max/sp;ball.vy*=max/sp}
    ball.x+=ball.vx;ball.y+=ball.vy;
    const r=ball.r;if(ball.x<r){ball.x=r;ball.vx=Math.abs(ball.vx)*.65}if(ball.x>1-r){ball.x=1-r;ball.vx=-Math.abs(ball.vx)*.65}if(ball.y<r){ball.y=r;ball.vy=Math.abs(ball.vy)*.65}if(ball.y>1-r){ball.y=1-r;ball.vy=-Math.abs(ball.vy)*.65}
    walls.forEach(collideWall);
    for(const h of holes){if(Math.hypot(ball.x-h.x,ball.y-h.y)<h.r*.72){falling=24;status.textContent='HOLE!';ball.vx=ball.vy=0;break}}
    if(Math.hypot(ball.x-goal.x,ball.y-goal.y)<goal.r*.62){won=true;status.textContent='★ CLEAR ★';if(navigator.vibrate)navigator.vibrate([30,30,60])}
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#eadcae';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(95,68,29,.09)';ctx.lineWidth=1;for(let y=16;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    // printed route marks
    ctx.fillStyle='#8b6d3f';ctx.font='800 11px ui-monospace,monospace';ctx.fillText('START',px(.055),py(.955));ctx.fillText('GOAL',px(.80),py(.055));
    // goal cup
    ctx.beginPath();ctx.arc(px(goal.x),py(goal.y),goal.r*Math.min(W,H),0,Math.PI*2);ctx.fillStyle='#d26d58';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#7c3c31';ctx.stroke();ctx.beginPath();ctx.arc(px(goal.x),py(goal.y),goal.r*.55*Math.min(W,H),0,Math.PI*2);ctx.fillStyle='#f0bd79';ctx.fill();
    // holes
    holes.forEach(h=>{const rr=h.r*Math.min(W,H);ctx.beginPath();ctx.arc(px(h.x),py(h.y),rr,0,Math.PI*2);ctx.fillStyle='#4a3825';ctx.fill();ctx.beginPath();ctx.arc(px(h.x)-rr*.2,py(h.y)-rr*.22,rr*.7,0,Math.PI*2);ctx.fillStyle='#241b13';ctx.fill()});
    // walls
    ctx.lineCap='round';ctx.lineWidth=10;ctx.strokeStyle='#9d7337';ctx.shadowColor='rgba(70,45,17,.28)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;for(const w of walls){ctx.beginPath();ctx.moveTo(px(w[0]),py(w[1]));ctx.lineTo(px(w[2]),py(w[3]));ctx.stroke()}ctx.shadowColor='transparent';
    // ball shadow + metal ball
    const br=ball.r*Math.min(W,H);ctx.beginPath();ctx.ellipse(px(ball.x)+4,py(ball.y)+5,br*.9,br*.55,0,0,Math.PI*2);ctx.fillStyle='rgba(55,40,20,.26)';ctx.fill();
    const g=ctx.createRadialGradient(px(ball.x)-br*.35,py(ball.y)-br*.4,1,px(ball.x),py(ball.y),br);g.addColorStop(0,'#fff');g.addColorStop(.2,'#dce4e6');g.addColorStop(.58,'#899497');g.addColorStop(1,'#374043');ctx.beginPath();ctx.arc(px(ball.x),py(ball.y),br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#41484a';ctx.stroke();
    if(falling>0){ctx.fillStyle=`rgba(40,27,13,${Math.min(.45,(24-falling)/30)})`;ctx.fillRect(0,0,W,H)}
  }
  function loop(){update();draw();requestAnimationFrame(loop)}
  board.addEventListener('pointerdown',e=>{drag=true;dragStart={x:e.clientX,y:e.clientY};board.setPointerCapture?.(e.pointerId)});
  board.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;tiltX=Math.max(-1,Math.min(1,dx/80));tiltY=Math.max(-1,Math.min(1,dy/80))});
  const endDrag=()=>{drag=false;if(!deviceTilt){tiltX=0;tiltY=0}};board.addEventListener('pointerup',endDrag);board.addEventListener('pointercancel',endDrag);
  async function enableTilt(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw new Error('denied')}
      window.addEventListener('deviceorientation',e=>{if(!deviceTilt)return;tiltX=Math.max(-1,Math.min(1,(e.gamma||0)/24));tiltY=Math.max(-1,Math.min(1,(e.beta||0)/24))});deviceTilt=true;tiltBtn.textContent='傾き操作 ON ✓';status.textContent='TILT READY';
    }catch{deviceTilt=false;tiltBtn.textContent='指操作で遊ぶ';status.textContent='DRAG MODE'}
  }
  tiltBtn.addEventListener('click',enableTilt);resetBtn.addEventListener('click',()=>reset());
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<320)e.preventDefault();lastTouch=now},{passive:false});
  new ResizeObserver(resize).observe(canvas);resize();reset();loop();
})();
</script>
</body>
</html>
