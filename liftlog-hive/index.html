<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070908" />
<title>LIFTLOG Honeycomb Exercise Map</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070908;--ink:#f5f7f6;--muted:#9ba39e;--line:rgba(255,255,255,.10);
  --panel:rgba(22,25,23,.92);--panel-strong:rgba(18,21,19,.97);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-width:320px;min-height:100%;overflow:hidden;background:#070908;color:var(--ink)}
body{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{position:relative;width:min(100%,430px);height:100svh;margin:0 auto;overflow:hidden;background:#070908}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.035),transparent 45%),#070908}
.world{position:absolute;left:0;top:0;width:1450px;height:1720px;will-change:transform;transform-origin:0 0}
.hex{position:absolute;width:164px;height:142px;transform:translate(-50%,-50%);transition:transform .28s cubic-bezier(.2,.86,.25,1),filter .24s ease,opacity .24s ease;will-change:transform,filter}
.hex svg{width:100%;height:100%;overflow:visible;display:block}
.hex polygon{stroke:rgba(4,7,5,.78);stroke-width:4;vector-effect:non-scaling-stroke;transition:stroke .22s ease,filter .22s ease}
.hex::after{content:"";position:absolute;inset:11% 12%;border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.13),transparent 40%,rgba(0,0,0,.13));mix-blend-mode:soft-light;pointer-events:none;opacity:.7}
.hex.empty{pointer-events:none}
.hex.empty .label{display:none}
.hex .label{position:absolute;left:15%;right:15%;top:50%;transform:translateY(-50%);text-align:center;color:#0a0d0b;text-shadow:0 1px rgba(255,255,255,.17);font-weight:900;font-size:13px;line-height:1.18;letter-spacing:-.03em;pointer-events:none;text-wrap:balance}
.hex .mark{position:absolute;right:18px;top:15px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 0 0 3px rgba(255,255,255,.12);opacity:0;transition:.2s}
.hex.planned .mark{opacity:1}
.hex.dim{opacity:.26;filter:saturate(.55)}
.hex.selected{z-index:20;transform:translate(-50%,-55%) scale(1.09);filter:saturate(1.08) brightness(1.05) drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.hex.selected polygon{stroke:rgba(255,255,255,.94);stroke-width:5;filter:drop-shadow(0 0 7px rgba(255,255,255,.22))}
.hex.selected .label{font-size:14px}

.topbar{position:absolute;z-index:40;left:0;right:0;top:0;height:112px;padding:max(14px,env(safe-area-inset-top)) 15px 0;background:linear-gradient(180deg,rgba(7,9,8,.98) 0%,rgba(7,9,8,.88) 62%,rgba(7,9,8,0) 100%);pointer-events:none}
.bar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px}.round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(19,22,20,.82);box-shadow:0 10px 32px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(12px);font-size:23px;pointer-events:auto}.brand{text-align:center}.brand small{display:block;color:rgba(255,255,255,.48);font-size:8px;font-weight:900;letter-spacing:.18em}.brand strong{display:block;margin-top:3px;font-size:18px;letter-spacing:-.04em}
.legend{display:flex;justify-content:center;gap:7px;margin-top:7px;pointer-events:none}.legend span{display:flex;align-items:center;gap:4px;color:rgba(255,255,255,.48);font-size:8px;font-weight:750}.legend i{width:7px;height:7px;border-radius:2px;background:var(--c)}

.search{position:absolute;z-index:55;inset:0;background:rgba(5,7,6,.74);backdrop-filter:blur(18px);padding:max(18px,env(safe-area-inset-top)) 15px 18px;opacity:0;pointer-events:none;transition:.2s}.search.open{opacity:1;pointer-events:auto}.search-head{display:grid;grid-template-columns:1fr 48px;gap:10px}.search-box{height:48px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(255,255,255,.08);padding:0 15px;outline:none}.search-close{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);font-size:20px}.results{margin-top:14px;border-top:1px solid rgba(255,255,255,.1)}.result{width:100%;min-height:60px;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:11px;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:transparent;text-align:left;padding:8px 2px}.result .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}.result strong{font-size:14px}.result small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.result .part{color:var(--muted);font-size:10px}

.hint{position:absolute;z-index:15;left:50%;top:118px;transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.42);font-size:9px;text-shadow:0 2px 12px #000;pointer-events:none;transition:opacity .25s}.hint.hide{opacity:0}
.cross{position:absolute;z-index:14;left:50%;top:49%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.16;pointer-events:none}.cross::before,.cross::after{content:"";position:absolute;background:#fff}.cross::before{width:20px;height:1px;top:9px}.cross::after{height:20px;width:1px;left:9px}

.sheet{position:absolute;z-index:45;left:13px;right:13px;bottom:max(12px,env(safe-area-inset-bottom));min-height:184px;border:1px solid rgba(255,255,255,.10);border-radius:28px;background:var(--panel);box-shadow:0 26px 80px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(24px);padding:17px 17px 14px;transform:translateY(calc(100% + 30px));opacity:0;transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .2s;pointer-events:none}.sheet.show{transform:translateY(0);opacity:1;pointer-events:auto}.handle{width:39px;height:4px;border-radius:99px;background:rgba(255,255,255,.28);margin:-5px auto 11px}.sheet-head{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center}.exercise-icon{width:54px;height:54px;display:grid;place-items:center;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);background:var(--c);color:#fff}.exercise-icon svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--c)}.sheet h1{margin:3px 0 0;font-size:23px;line-height:1.05;letter-spacing:-.05em}.sheet-meta{display:grid;grid-template-columns:1fr 1fr;margin-top:13px;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}.meta-item{padding:10px 7px 10px 0}.meta-item+.meta-item{border-left:1px solid rgba(255,255,255,.1);padding-left:14px}.meta-item span{display:block;color:var(--muted);font-size:9px}.meta-item strong{display:block;margin-top:3px;font-size:16px}.actions{display:grid;grid-template-columns:.9fr 1.2fr;gap:9px;margin-top:12px}.action{min-height:48px;border-radius:14px;font-weight:850;font-size:12px}.ghost{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}.primary{border:0;background:var(--c);color:#0a0d0b;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 25%,transparent)}

.toast{position:absolute;z-index:70;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 200px);transform:translate(-50%,14px);padding:10px 14px;border-radius:999px;background:#f5f7f5;color:#101411;font-size:10px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:431px){body{display:grid;place-items:center;background:#0f1311}.app{height:min(920px,calc(100svh - 32px));border:1px solid rgba(255,255,255,.1);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.35)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="viewport" id="viewport"><div class="world" id="world"></div></div>
  <header class="topbar">
    <div class="bar">
      <button class="round" id="back" aria-label="戻る">‹</button>
      <div class="brand"><small>LIFTLOG LAB</small><strong>EXERCISE MAP</strong></div>
      <button class="round" id="searchOpen" aria-label="種目を検索">⌕</button>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="hint" id="hint">自由にドラッグして探索 · 種目をタップするとフォーカス</div>
  <div class="cross"></div>
  <section class="sheet" id="sheet" aria-live="polite">
    <div class="handle"></div>
    <div class="sheet-head">
      <div class="exercise-icon" id="exerciseIcon"></div>
      <div><div class="eyebrow" id="detailPart">BACK · 背中</div><h1 id="detailName">ラットプルダウン</h1></div>
    </div>
    <div class="sheet-meta">
      <div class="meta-item"><span>前回の記録</span><strong id="detailPrev">72.5kg × 10rep</strong></div>
      <div class="meta-item"><span>主に使う部位</span><strong id="detailRole">広背筋</strong></div>
    </div>
    <div class="actions"><button class="action ghost" id="formBtn">フォームを見る</button><button class="action primary" id="choose">この種目を選択</button></div>
  </section>
  <section class="search" id="searchPanel" aria-label="種目検索">
    <div class="search-head"><input class="search-box" id="searchInput" placeholder="種目名を検索" autocomplete="off" /><button class="search-close" id="searchClose">×</button></div>
    <div class="results" id="results"></div>
  </section>
  <div class="toast" id="toast">この種目を選択する想定です</div>
</div>
<script>
(()=>{
const app=document.getElementById('app'),viewport=document.getElementById('viewport'),worldEl=document.getElementById('world');
const sheet=document.getElementById('sheet'),hint=document.getElementById('hint'),toast=document.getElementById('toast');
const searchPanel=document.getElementById('searchPanel'),searchInput=document.getElementById('searchInput'),results=document.getElementById('results');
const colors={胸:'#ef6b63',背中:'#4f8fd8',肩:'#e9ad2f',腕:'#9c5ac6',脚:'#63a83d',体幹:'#3aa6a5'};
const partEn={胸:'CHEST',背中:'BACK',肩:'SHOULDER',腕:'ARMS',脚:'LEGS',体幹:'CORE'};
const cluster=[{part:'胸',x:320,y:300},{part:'肩',x:1030,y:310},{part:'背中',x:600,y:760},{part:'腕',x:1080,y:760},{part:'脚',x:330,y:1260},{part:'体幹',x:850,y:1320}];
const exercises=[
{name:'インクラインベンチプレス',part:'胸',role:'大胸筋上部',prev:'60kg × 8rep',col:1,row:1,planned:true},
{name:'チェストプレス',part:'胸',role:'大胸筋',prev:'65kg × 10rep',col:2,row:1},
{name:'デクラインベンチプレス',part:'胸',role:'大胸筋下部',prev:'60kg × 8rep',col:3,row:1},
{name:'ダンベルプレス',part:'胸',role:'大胸筋',prev:'28kg × 10rep',col:1,row:2},
{name:'ベンチプレス',part:'胸',role:'大胸筋・三頭筋',prev:'70kg × 8rep',col:2,row:2,planned:true},
{name:'ダンベルフライ',part:'胸',role:'大胸筋',prev:'18kg × 12rep',col:3,row:2},
{name:'ケーブルフライ',part:'胸',role:'大胸筋',prev:'22.5kg × 12rep',col:1,row:3},
{name:'ペックデック',part:'胸',role:'大胸筋',prev:'45kg × 12rep',col:2,row:3},
{name:'プッシュアップ',part:'胸',role:'大胸筋・三頭筋',prev:'15rep',col:3,row:3},

{name:'ショルダープレス',part:'肩',role:'三角筋前・中部',prev:'22kg × 7rep',col:6,row:1},
{name:'アップライトロー',part:'肩',role:'三角筋・僧帽筋',prev:'30kg × 10rep',col:7,row:1},
{name:'サイドレイズ',part:'肩',role:'三角筋中部',prev:'8kg × 16rep',col:6,row:2},
{name:'リアレイズ',part:'肩',role:'三角筋後部',prev:'8kg × 12rep',col:7,row:2},
{name:'アーノルドプレス',part:'肩',role:'三角筋',prev:'16kg × 10rep',col:6,row:3},
{name:'フェイスプル',part:'肩',role:'三角筋後部',prev:'25kg × 12rep',col:7,row:3},

{name:'チンニング',part:'背中',role:'広背筋・二頭筋',prev:'8rep',col:2,row:5},
{name:'ラットプルダウン',part:'背中',role:'広背筋・上腕二頭筋',prev:'72.5kg × 10rep',col:3,row:5,planned:true},
{name:'シーテッドロー',part:'背中',role:'僧帽筋・広背筋',prev:'60kg × 10rep',col:4,row:5},
{name:'ワンハンドロー',part:'背中',role:'広背筋',prev:'30kg × 10rep',col:3,row:6},
{name:'Tバーロー',part:'背中',role:'背中中央',prev:'50kg × 8rep',col:2,row:7},
{name:'ベントオーバーロー',part:'背中',role:'背中全体',prev:'55kg × 8rep',col:3,row:7},
{name:'デッドリフト',part:'背中',role:'脊柱起立筋・臀部',prev:'100kg × 5rep',col:4,row:7},
{name:'バックエクステンション',part:'背中',role:'脊柱起立筋',prev:'12rep',col:2,row:8},
{name:'ストレートアームプルダウン',part:'背中',role:'広背筋',prev:'30kg × 12rep',col:3,row:8},

{name:'アームカール',part:'腕',role:'上腕二頭筋',prev:'25kg × 10rep',col:6,row:5},
{name:'ハンマーカール',part:'腕',role:'腕橈骨筋・二頭筋',prev:'12kg × 10rep',col:7,row:5},
{name:'インクラインカール',part:'腕',role:'上腕二頭筋',prev:'12kg × 7rep',col:6,row:6},
{name:'ケーブルカール',part:'腕',role:'上腕二頭筋',prev:'22.5kg × 12rep',col:7,row:6},
{name:'トライセプスプッシュダウン',part:'腕',role:'上腕三頭筋',prev:'27.5kg × 12rep',col:6,row:7},
{name:'オーバーヘッドエクステンション',part:'腕',role:'上腕三頭筋',prev:'20kg × 10rep',col:7,row:7},
{name:'ディップス',part:'腕',role:'上腕三頭筋・胸',prev:'10rep',col:6,row:8},
{name:'ナロープッシュアップ',part:'腕',role:'上腕三頭筋',prev:'12rep',col:7,row:8},

{name:'スクワット',part:'脚',role:'脚全体',prev:'70kg × 8rep',col:1,row:9},
{name:'フロントスクワット',part:'脚',role:'大腿四頭筋',prev:'50kg × 8rep',col:2,row:9},
{name:'レッグプレス',part:'脚',role:'大腿四頭筋・臀部',prev:'140kg × 10rep',col:1,row:10},
{name:'ルーマニアンデッドリフト',part:'脚',role:'ハムストリング',prev:'70kg × 8rep',col:1,row:11},
{name:'レッグカール',part:'脚',role:'ハムストリング',prev:'75kg × 8rep',col:2,row:11},
{name:'レッグエクステンション',part:'脚',role:'大腿四頭筋',prev:'80kg × 15rep',col:1,row:12,planned:true},
{name:'カーフレイズ',part:'脚',role:'下腿三頭筋',prev:'80kg × 15rep',col:2,row:12},

{name:'プランク',part:'体幹',role:'腹横筋・腹直筋',prev:'60秒',col:5,row:10},
{name:'サイドプランク',part:'体幹',role:'腹斜筋',prev:'45秒',col:6,row:10},
{name:'デッドバグ',part:'体幹',role:'腹部・股関節',prev:'12rep',col:7,row:10},
{name:'クランチ',part:'体幹',role:'腹直筋',prev:'15rep',col:4,row:11},
{name:'リバースクランチ',part:'体幹',role:'下腹部',prev:'12rep',col:5,row:11},
{name:'レッグレイズ',part:'体幹',role:'腹直筋',prev:'12rep',col:6,row:11},
{name:'ロシアンツイスト',part:'体幹',role:'腹斜筋',prev:'20rep',col:4,row:12},
{name:'アブローラー',part:'体幹',role:'腹直筋・広背筋',prev:'10rep',col:5,row:12}
];

const R=82,hexW=R*2,hexH=Math.sqrt(3)*R,hStep=R*1.5,vStep=hexH;
const world={w:1450,h:1720};
const cells=[];
function cellCenter(col,row){return{x:145+col*hStep,y:125+row*vStep+(col%2?hexH/2:0)}}
function nearestPart(x,y){let best=cluster[0],d=Infinity;for(const c of cluster){const nd=(c.x-x)**2+(c.y-y)**2;if(nd<d){d=nd;best=c}}return best.part}
const exMap=new Map(exercises.map(e=>[`${e.col}:${e.row}`,e]));
for(let col=0;col<10;col++)for(let row=0;row<13;row++){
  const p=cellCenter(col,row);const ex=exMap.get(`${col}:${row}`);const part=ex?.part||nearestPart(p.x,p.y);
  cells.push({col,row,x:p.x,y:p.y,part,exercise:ex||null});
}

function hexPoints(){return '82,2 160,37 160,105 82,140 4,105 4,37'}
function makeCell(c){
  const el=document.createElement('button');el.className='hex'+(c.exercise?'':' empty')+(c.exercise?.planned?' planned':'');el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.setProperty('--c',colors[c.part]);el.dataset.part=c.part;
  const color=colors[c.part];el.innerHTML=`<svg viewBox="0 0 164 142" aria-hidden="true"><defs><linearGradient id="g${c.col}_${c.row}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(color,'#ffffff',.10)}"/><stop offset="1" stop-color="${mix(color,'#000000',.12)}"/></linearGradient></defs><polygon points="${hexPoints()}" fill="url(#g${c.col}_${c.row})"/></svg>${c.exercise?`<span class="label">${splitName(c.exercise.name)}</span><i class="mark"></i>`:''}`;
  if(c.exercise){el.type='button';el.setAttribute('aria-label',c.exercise.name);el.addEventListener('click',e=>{e.stopPropagation();selectExercise(c.exercise,true)});c.exercise.el=el;c.exercise.x=c.x;c.exercise.y=c.y}
  worldEl.appendChild(el);return el;
}
function splitName(name){const map={'インクラインベンチプレス':'インクライン<br>ベンチプレス','デクラインベンチプレス':'デクライン<br>ベンチプレス','ストレートアームプルダウン':'ストレートアーム<br>プルダウン','トライセプスプッシュダウン':'トライセプス<br>プッシュダウン','オーバーヘッドエクステンション':'オーバーヘッド<br>エクステンション','レッグエクステンション':'レッグ<br>エクステンション','ルーマニアンデッドリフト':'ルーマニアン<br>デッドリフト','ハンギングレッグレイズ':'ハンギング<br>レッグレイズ'};return map[name]||name.replace('ダンベル','ダンベル<br>').replace('シーテッド','シーテッド<br>').replace('ショルダー','ショルダー<br>')}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ar=pa>>16,ag=pa>>8&255,ab=pa&255,br=pb>>16,bg=pb>>8&255,bb=pb&255;return '#'+[ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
cells.forEach(makeCell);

Object.entries(colors).forEach(([part,color])=>{const s=document.createElement('span');s.style.setProperty('--c',color);s.innerHTML=`<i></i>${part}`;document.getElementById('legend').appendChild(s)});

const appRect=()=>app.getBoundingClientRect();
const camera={x:430,y:720,tx:430,ty:720,scale:.72,tscale:.72};let dragging=false,moved=false,lastX=0,lastY=0,startX=0,startY=0,selected=null,raf=null,toastTimer;
function applyCamera(){const rect=appRect(),cx=rect.width/2,cy=rect.height/2;worldEl.style.transform=`translate(${cx-camera.x*camera.scale}px,${cy-camera.y*camera.scale}px) scale(${camera.scale})`}
function animate(){camera.x+=(camera.tx-camera.x)*.12;camera.y+=(camera.ty-camera.y)*.12;camera.scale+=(camera.tscale-camera.scale)*.12;applyCamera();raf=requestAnimationFrame(animate)}animate();
function clamp(){camera.tx=Math.max(180,Math.min(world.w-180,camera.tx));camera.ty=Math.max(200,Math.min(world.h-190,camera.ty))}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.hex'))return;dragging=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;viewport.setPointerCapture(e.pointerId);camera.tx=camera.x;camera.ty=camera.y;hint.classList.add('hide')});
viewport.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.hypot(e.clientX-startX,e.clientY-startY)>5)moved=true;camera.tx-=dx/camera.scale;camera.ty-=dy/camera.scale;clamp();lastX=e.clientX;lastY=e.clientY});
viewport.addEventListener('pointerup',e=>{dragging=false;try{viewport.releasePointerCapture(e.pointerId)}catch{}});
viewport.addEventListener('pointercancel',()=>dragging=false);

function selectExercise(ex,focus=true){
  if(selected?.el)selected.el.classList.remove('selected');selected=ex;ex.el.classList.add('selected');
  [...worldEl.children].forEach(el=>el.classList.toggle('dim',el.classList.contains('hex')&&el!==ex.el&&!!selected));
  if(focus){camera.tx=ex.x;camera.ty=ex.y-25;camera.tscale=.88;clamp()}
  const c=colors[ex.part];sheet.style.setProperty('--c',c);document.getElementById('exerciseIcon').style.setProperty('--c',c);document.getElementById('detailPart').textContent=`${partEn[ex.part]} · ${ex.part}`;document.getElementById('detailName').textContent=ex.name;document.getElementById('detailPrev').textContent=ex.prev;document.getElementById('detailRole').textContent=ex.role;document.getElementById('exerciseIcon').innerHTML=formIcon(ex.part);sheet.classList.add('show');hint.classList.add('hide')
}
function clearSelection(){if(selected?.el)selected.el.classList.remove('selected');selected=null;[...worldEl.children].forEach(el=>el.classList.remove('dim'));sheet.classList.remove('show');camera.tscale=.72}
function formIcon(part){
  if(part==='脚')return '<svg viewBox="0 0 48 48"><circle cx="24" cy="8" r="4"/><path d="M24 12v11m0 0-8 8m8-8 8 8M20 18l-7 3m15-3 7 3M16 31l-4 10m20-10 4 10"/></svg>';
  if(part==='体幹')return '<svg viewBox="0 0 48 48"><circle cx="14" cy="23" r="4"/><path d="M18 23h13l8 7M24 23l5 13M18 23l-7 10M29 36h10"/></svg>';
  return '<svg viewBox="0 0 48 48"><circle cx="24" cy="8" r="4"/><path d="M24 12v17m-9-7 9-5 9 5M18 29l-5 11m17-11 5 11M10 18h28"/></svg>';
}

document.getElementById('searchOpen').onclick=()=>{searchPanel.classList.add('open');searchInput.value='';renderResults('');setTimeout(()=>searchInput.focus(),100)};document.getElementById('searchClose').onclick=()=>searchPanel.classList.remove('open');searchInput.addEventListener('input',()=>renderResults(searchInput.value.trim()));
function renderResults(q){results.innerHTML='';const list=exercises.filter(e=>!q||e.name.includes(q)||e.part.includes(q)||e.role.includes(q)).slice(0,12);for(const ex of list){const b=document.createElement('button');b.className='result';b.style.setProperty('--c',colors[ex.part]);b.innerHTML=`<i class="dot"></i><span><strong>${ex.name}</strong><small>${ex.prev} · ${ex.role}</small></span><span class="part">${ex.part}</span>`;b.onclick=()=>{searchPanel.classList.remove('open');selectExercise(ex,true)};results.appendChild(b)}}

document.getElementById('choose').onclick=()=>showToast(`${selected?.name||'種目'}を選択する想定です`);document.getElementById('formBtn').onclick=()=>showToast('フォーム解説を開く想定です');document.getElementById('back').onclick=()=>history.length>1?history.back():showToast('戻る想定です');
viewport.addEventListener('dblclick',clearSelection);
function showToast(t){clearTimeout(toastTimer);toast.textContent=t;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)}

const first=exercises.find(e=>e.name==='ラットプルダウン');setTimeout(()=>selectExercise(first,true),250);
})();
</script>
</body>
</html>
