<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#050706" />
<title>LIFTLOG Hive Explorer</title>
<style>
:root{color-scheme:dark;--bg:#050706;--ink:#f4f7f5;--muted:#8f9892;--panel:rgba(24,27,25,.92);--line:rgba(255,255,255,.11);--accent:#7ad99f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-width:320px;min-height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}.app{position:relative;width:min(100%,430px);height:100svh;margin:0 auto;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(122,217,159,.11),transparent 25%),#050706}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;z-index:20;inset:max(12px,env(safe-area-inset-top)) 14px auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;pointer-events:none}.round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(20,23,21,.82);box-shadow:0 10px 34px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(12px);cursor:pointer;pointer-events:auto;font-size:24px}.brand{text-align:center;text-shadow:0 2px 18px #000}.brand small{display:block;color:rgba(255,255,255,.48);font-size:8px;font-weight:900;letter-spacing:.18em}.brand strong{display:block;margin-top:3px;font-size:14px;font-weight:900;letter-spacing:-.03em}
.legend{position:absolute;z-index:18;left:12px;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 60px);display:flex;gap:6px;overflow:auto;padding:2px 2px 12px;scrollbar-width:none;pointer-events:auto;mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}.legend::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:31px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(9,11,10,.62);color:rgba(255,255,255,.56);backdrop-filter:blur(9px);font-size:10px;font-weight:850;cursor:pointer}.chip.active{color:#fff;border-color:color-mix(in srgb,var(--c) 72%,white 28%)}.chip i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--c)}
.tip{position:absolute;z-index:8;top:calc(max(12px,env(safe-area-inset-top)) + 108px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.42);font-size:9px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 12px #000;transition:opacity .2s}.tip.hide{opacity:0}
.detail{position:absolute;z-index:25;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));min-height:128px;padding:15px 78px 15px 17px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:var(--panel);box-shadow:0 20px 70px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(22px);transform:translateY(calc(100% + 32px));opacity:0;transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s ease;pointer-events:none}.detail.show{transform:translateY(0);opacity:1;pointer-events:auto}.eyebrow{color:var(--bubble-color,var(--accent));font-size:9px;font-weight:950;letter-spacing:.15em}.detail h1{margin:5px 0 0;font-size:21px;line-height:1.07;letter-spacing:-.045em}.meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;color:var(--muted);font-size:9px}.meta b{color:var(--ink);font-size:11px}.choose{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.13);font-size:26px;cursor:pointer}.mode-badge{position:absolute;z-index:10;right:13px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 137px);padding:6px 9px;border-radius:999px;background:rgba(5,7,6,.62);color:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.07);font-size:8px;font-weight:800;backdrop-filter:blur(9px);pointer-events:none}
.toast{position:absolute;z-index:40;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 148px);transform:translate(-50%,14px);padding:10px 14px;border-radius:999px;background:#f5f7f5;color:#101411;font-size:10px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:431px){body{display:grid;place-items:center;background:#0c100e}.app{height:min(920px,calc(100svh - 32px));border:1px solid rgba(255,255,255,.11);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.32)}}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="canvas" aria-label="筋トレ種目のハイブマップ"></canvas>
  <div class="topbar">
    <button class="round" id="back" aria-label="戻る">‹</button>
    <div class="brand"><small>LIFTLOG LAB</small><strong>HIVE EXERCISE MAP</strong></div>
    <button class="round" id="reset" aria-label="表示をリセット">⌕</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip">自由にドラッグして探索 · タップで中央へフォーカス</div>
  <div class="mode-badge">ADAPTIVE HIVE / NO PHYSICS</div>
  <section class="detail" id="detail" aria-live="polite">
    <div class="eyebrow" id="detailPart">BACK · 背中</div>
    <h1 id="detailName">ラットプルダウン</h1>
    <div class="meta"><span>前回 <b id="detailPrev">72.5kg × 10</b></span><span>主力 <b id="detailRole">広背筋</b></span></div>
    <button class="choose" id="choose" aria-label="この種目を選択">→</button>
  </section>
  <div class="toast" id="toast">この種目を選択する想定です</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),app=document.getElementById('app');
const detail=document.getElementById('detail'),tip=document.getElementById('tip'),toast=document.getElementById('toast');
const colors={胸:'#f06f66',背中:'#73b8ec',肩:'#efc85f',腕:'#b98ee0',脚:'#70d39a',体幹:'#68d2cc'};
const partEn={胸:'CHEST',背中:'BACK',肩:'SHOULDER',腕:'ARMS',脚:'LEGS',体幹:'CORE'};
const world={w:920,h:1320};
const cells=[
['ベンチプレス','胸','胸全体','70kg × 8',210,190,78],['インクライン\nダンベルプレス','胸','上部胸','28kg × 10',346,190,86],['ダンベルフライ','胸','胸ストレッチ','18kg × 12',482,190,70],['チェストプレス','胸','胸全体','60kg × 10',278,305,70],['ケーブルクロス','胸','胸内側','22.5kg × 12',414,305,68],
['ラットプルダウン','背中','広背筋','72.5kg × 10',180,500,90],['シーテッドロー','背中','背中中央','60kg × 10',316,500,75],['ワンハンドロー','背中','広背筋','30kg × 10',452,500,77],['ストレートアーム\nプルダウン','背中','広背筋','30kg × 12',248,615,72],['ベントオーバーロー','背中','背中全体','55kg × 8',384,615,82],
['ショルダープレス','肩','前・中部','22kg × 7',610,305,79],['サイドレイズ','肩','中部','8kg × 16',678,420,74],['リアデルト\nマシン','肩','後部','47.5kg × 8',746,305,67],['フロントレイズ','肩','前部','8kg × 12',814,420,63],
['インクラインカール','腕','二頭','12kg × 7',592,590,75],['ケーブル\nプレスダウン','腕','三頭','27.5kg × 12',728,590,80],['ハンマーカール','腕','腕橈骨筋','12kg × 10',660,705,67],['スカルクラッシャー','腕','三頭','20kg × 10',796,705,68],
['スクワット','脚','脚全体','70kg × 8',210,835,90],['レッグ\nエクステンション','脚','大腿四頭筋','80kg × 15',346,835,82],['レッグカール','脚','ハム','75kg × 8',482,835,73],['ブルガリアン\nスクワット','脚','脚全体','20kg × 10',278,950,78],['カーフレイズ','脚','ふくらはぎ','80kg × 15',414,950,65],
['プランク','体幹','腹部','60秒',610,940,70],['ハンギング\nレッグレイズ','体幹','腹部','12rep',746,940,79],['アブローラー','体幹','腹部','10rep',678,1055,70]
].map((d,i)=>({id:i,name:d[0],part:d[1],role:d[2],prev:d[3],x:d[4],y:d[5],r:d[6],color:colors[d[1]]}));
let W=0,H=0,dpr=1;const camera={x:430,y:600,tx:430,ty:600,s:0.82,ts:0.82};let selected=null,filter=null,down=false,moved=false,lastX=0,lastY=0,startX=0,startY=0,toastTimer;
function resize(){const r=app.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function screenToWorld(x,y){return{x:(x-W/2)/camera.s+camera.x,y:(y-H/2)/camera.s+camera.y}}
function worldToScreen(x,y){return{x:(x-camera.x)*camera.s+W/2,y:(y-camera.y)*camera.s+H/2}}
function hexPoints(x,y,r){const pts=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r])}return pts}
function roundedHexPath(x,y,r,round=14){const pts=hexPoints(x,y,r);ctx.beginPath();for(let i=0;i<6;i++){const p=pts[i],prev=pts[(i+5)%6],next=pts[(i+1)%6];const a={x:p[0]+(prev[0]-p[0])*round/r,y:p[1]+(prev[1]-p[1])*round/r};const b={x:p[0]+(next[0]-p[0])*round/r,y:p[1]+(next[1]-p[1])*round/r};if(i===0)ctx.moveTo(a.x,a.y);else ctx.lineTo(a.x,a.y);ctx.quadraticCurveTo(p[0],p[1],b.x,b.y)}ctx.closePath()}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function drawCell(c){const p=worldToScreen(c.x,c.y);const isSel=selected===c;const dim=(filter&&c.part!==filter)||(selected&&selected!==c);const r=c.r*camera.s*(isSel?1.14:1);ctx.save();ctx.globalAlpha=dim?.26:1;roundedHexPath(p.x,p.y,r,Math.min(16*camera.s,r*.18));const g=ctx.createLinearGradient(p.x-r,p.y-r,p.x+r,p.y+r);g.addColorStop(0,rgba(c.color,.96));g.addColorStop(1,rgba(c.color,.72));ctx.fillStyle=g;ctx.shadowColor=isSel?'rgba(255,255,255,.34)':'rgba(0,0,0,.22)';ctx.shadowBlur=isSel?24:14;ctx.shadowOffsetY=6;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=isSel?3:1;ctx.strokeStyle=isSel?'rgba(255,255,255,.92)':'rgba(255,255,255,.16)';ctx.stroke();const fs=Math.max(9,Math.min(15,r*.17));ctx.fillStyle='#0b0e0c';ctx.font=`900 ${fs}px Inter,"Noto Sans JP",system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';const lines=c.name.split('\n');lines.forEach((line,i)=>ctx.fillText(line,p.x,p.y+(i-(lines.length-1)/2)*(fs+2),r*1.45));ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);cells.forEach(drawCell);ctx.save();ctx.strokeStyle='rgba(255,255,255,.05)';ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(W/2-12,H/2);ctx.lineTo(W/2+12,H/2);ctx.moveTo(W/2,H/2-12);ctx.lineTo(W/2,H/2+12);ctx.stroke();ctx.restore()}
function tick(){camera.x+=(camera.tx-camera.x)*.11;camera.y+=(camera.ty-camera.y)*.11;camera.s+=(camera.ts-camera.s)*.1;draw();requestAnimationFrame(tick)}tick();
function select(c){selected=c;camera.tx=c.x;camera.ty=c.y;camera.ts=1.08;tip.classList.add('hide');detail.style.setProperty('--bubble-color',c.color);document.getElementById('detailPart').textContent=`${partEn[c.part]} · ${c.part}`;document.getElementById('detailName').textContent=c.name.replace('\n',' ');document.getElementById('detailPrev').textContent=c.prev;document.getElementById('detailRole').textContent=c.role;detail.classList.add('show')}
function hit(sx,sy){const w=screenToWorld(sx,sy);let best=null,bd=Infinity;for(const c of cells){if(filter&&c.part!==filter)continue;const d=Math.hypot(w.x-c.x,w.y-c.y);if(d<c.r*1.03&&d<bd){best=c;bd=d}}return best}
canvas.addEventListener('pointerdown',e=>{down=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.hypot(e.clientX-startX,e.clientY-startY)>6)moved=true;camera.tx-=dx/camera.s;camera.ty-=dy/camera.s;camera.x=camera.tx;camera.y=camera.ty;lastX=e.clientX;lastY=e.clientY;tip.classList.add('hide')});canvas.addEventListener('pointerup',e=>{down=false;if(!moved){const c=hit(e.clientX,e.clientY);if(c)select(c)}});
function reset(){selected=null;filter=null;camera.tx=430;camera.ty=600;camera.ts=.82;detail.classList.remove('show');tip.classList.remove('hide');document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'))}
document.getElementById('reset').onclick=reset;document.getElementById('back').onclick=()=>history.back();document.getElementById('choose').onclick=()=>{clearTimeout(toastTimer);toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)};
const legend=document.getElementById('legend');Object.keys(colors).forEach(part=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',colors[part]);b.innerHTML=`<i></i>${part}`;b.onclick=()=>{filter=filter===part?null:part;selected=null;detail.classList.remove('show');[...legend.children].forEach(el=>el.classList.toggle('active',el===b&&filter));if(filter){const a=cells.filter(c=>c.part===filter);camera.tx=a.reduce((s,c)=>s+c.x,0)/a.length;camera.ty=a.reduce((s,c)=>s+c.y,0)/a.length;camera.ts=.95}else{camera.tx=430;camera.ty=600;camera.ts=.82}};legend.appendChild(b)});
})();
</script>
</body>
</html>
