function targetForEnemy(e,playerCell){if(e.type==='chaser')return playerCell;const pv=ballBody.linvel();if(e.type==='ambusher'){const dc=Math.abs(pv.x)>Math.abs(pv.z)?Math.sign(pv.x):0,dr=Math.abs(pv.z)>=Math.abs(pv.x)?Math.sign(pv.z):0;return{c:clamp(playerCell.c+dc*2,0,currentMaze.cols-1),r:clamp(playerCell.r+dr*2,0,currentMaze.rows-1)}}const man=Math.abs(e.cell.c-playerCell.c)+Math.abs(e.cell.r-playerCell.r);if(man<=4)return playerCell;const ns=neighbors(e.cell);return ns[Math.floor(rng()*ns.length)]||playerCell}
function thinkEnemy(e,now,playerCell){if(now<e.nextThink&&e.pathIndex<e.path.length)return;const target=targetForEnemy(e,playerCell);e.path=bfs(e.cell,target);e.pathIndex=Math.min(1,e.path.length-1);e.nextThink=now+(e.type==='wanderer'?650:350)}
function updateEnemies(dt,now,playerPos){const playerCell=cellFromPos(playerPos.x,playerPos.z),cfg=CONFIG[difficulty],powered=now<powerUntil;for(const e of enemies){thinkEnemy(e,now,playerCell);const next=e.path[e.pathIndex];if(next){const p=pos(next.c,next.r),dx=p.x-e.mesh.position.x,dz=p.z-e.mesh.position.z,dist=Math.hypot(dx,dz),speed=cfg.enemySpeed*(powered?.62:1);if(dist<.04){e.cell={c:next.c,r:next.r};e.pathIndex++;if(e.pathIndex>=e.path.length)e.nextThink=0}else{e.mesh.position.x+=dx/dist*speed*dt;e.mesh.position.z+=dz/dist*speed*dt}}e.mesh.position.y=.24+Math.sin(now*.005+e.spawn.c)*.025;e.mesh.material.color.setHex(powered?0x4f8dff:e.normalColor);e.mesh.material.emissive.setHex(powered?0x123f99:0x2a0000);const hit=Math.hypot(e.mesh.position.x-playerPos.x,e.mesh.position.z-playerPos.z)<.42;if(hit){if(powered){score+=200;const s=pos(e.spawn.c,e.spawn.r);e.mesh.position.set(s.x,.24,s.z);e.cell={...e.spawn};e.path=[];e.nextThink=now+900;flash('+200 ENEMY DOWN',500);updateHud()}else if(now>invincibleUntil){lives--;updateHud();if(navigator.vibrate)navigator.vibrate([40,30,70]);if(lives<=0){finished=true;flash(`GAME OVER\nSCORE ${score}`,1800)}else{flash(`CAUGHT!  ♥${lives}`,750);resetPlayer(false)}}}}}
function collectCoins(now,t){for(const c of coins){if(!c.active)continue;c.mesh.rotation.y+=.035;c.mesh.rotation.z=.12*Math.sin(now*.004+c.x);if(Math.hypot(c.x-t.x,c.z-t.z)<(c.big?.34:.27)){c.active=false;c.mesh.visible=false;score+=c.big?100:10;if(c.big){powerUntil=now+6500;toy.classList.add('power');flash('POWER MODE!',600);if(navigator.vibrate)navigator.vibrate(35)}updateHud()}}if(!finished&&coins.every(c=>!c.active)){finished=true;score+=lives*250;updateHud();flash(`★ CLEAR ★\nSCORE ${score}`,1800);if(navigator.vibrate)navigator.vibrate([40,40,90])}}
function physicsStep(){if(!ballBody||finished)return;const control=deviceTilt?tilt:dragTilt;ballBody.addForce({x:control.x*8.6,y:0,z:control.z*8.6},true);world.step()}
function updateLocator(t,now){if(!t||!camera){playerMarker.classList.add('hidden');return}locatorRing.position.set(t.x,.026,t.z);locatorRing.scale.setScalar(1+Math.sin(now*.007)*.10);markerProjection.set(t.x,t.y+.12,t.z).project(camera);if(markerProjection.z<-1||markerProjection.z>1){playerMarker.classList.add('hidden');return}const r=view.getBoundingClientRect(),x=(markerProjection.x*.5+.5)*r.width,y=(-markerProjection.y*.5+.5)*r.height;playerMarker.style.left=`${clamp(x,20,r.width-20)}px`;playerMarker.style.top=`${clamp(y,36,r.height-20)}px`;playerMarker.classList.remove('hidden')}
function render(now){if(!renderer)return;const t=ballBody.translation(),q=ballBody.rotation();ballMesh.position.set(t.x,t.y,t.z);ballMesh.quaternion.set(q.x,q.y,q.z,q.w);collectCoins(now,t);updateEnemies(Math.min(.033,(now-lastRender)/1000||.016),now,t);lastRender=now;const power=Math.max(0,powerUntil-now);powerFill.style.width=`${Math.min(100,power/65)}%`;if(!power){toy.classList.remove('power')}updateLocator(t,now);renderer.render(scene,camera)}let lastRender=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;accumulator+=dt;while(accumulator>=fixedStep){physicsStep();accumulator-=fixedStep}render(now)}
function fitCamera(){if(!camera)return;const aspect=Math.max(.35,camera.aspect||1),vHalf=THREE.MathUtils.degToRad(camera.fov*.5),hHalf=Math.atan(Math.tan(vHalf)*aspect),halfW=currentBoardW/2+.6,halfD=currentBoardD/2+.6,distW=halfW/Math.tan(Math.max(.12,hHalf)),distD=halfD/Math.tan(Math.max(.12,vHalf)),distance=Math.max(distW,distD)*1.22,dir=new THREE.Vector3(0,1.48,.46).normalize();camera.position.copy(dir.multiplyScalar(distance));camera.lookAt(0,0,0);camera.updateProjectionMatrix()}
function resize(){if(!renderer)return;const r=view.getBoundingClientRect();if(r.width<2||r.height<2)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;fitCamera()}
shell.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;drag=true;dragStart={x:e.clientX,y:e.clientY};shell.setPointerCapture?.(e.pointerId);ballBody?.wakeUp()});shell.addEventListener('pointermove',e=>{if(!drag)return;dragTilt.x=clamp((e.clientX-dragStart.x)/90,-1,1);dragTilt.z=clamp((e.clientY-dragStart.y)/90,-1,1)});function endDrag(){drag=false;dragTilt.x=dragTilt.z=0}shell.addEventListener('pointerup',endDrag);shell.addEventListener('pointercancel',endDrag);
async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw 0}if(!orientationBound){window.addEventListener('deviceorientation',e=>{if(!deviceTilt)return;if(baseBeta===null){baseBeta=e.beta||0;baseGamma=e.gamma||0}tilt.x=clamp(((e.gamma||0)-baseGamma)/15,-1,1);tilt.z=clamp(((e.beta||0)-baseBeta)/15,-1,1)});orientationBound=true}baseBeta=baseGamma=null;deviceTilt=true;ballBody?.wakeUp();tiltBtn.textContent='傾き操作 ON ✓';flash('TILT READY',550)}catch{deviceTilt=false;tiltBtn.textContent='指操作 MODE';flash('DRAG MODE',550)}}
tiltBtn.addEventListener('click',enableTilt);retryBtn.addEventListener('click',()=>{buildWorld();flash('RETRY',500)});newBtn.addEventListener('click',()=>{seed=randomSeed();buildWorld();flash('NEW MAZE',500)});diffBtns.forEach(btn=>btn.addEventListener('click',()=>{difficulty=btn.dataset.diff;diffBtns.forEach(b=>b.classList.toggle('active',b===btn));seed=randomSeed();buildWorld();flash(`${CONFIG[difficulty].label} MODE`,600)}));window.addEventListener('resize',resize);new ResizeObserver(resize).observe(view);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<320)e.preventDefault();lastTouch=n},{passive:false});buildWorld();loading.classList.add('hidden');requestAnimationFrame(loop);
</script>
