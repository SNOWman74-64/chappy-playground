<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f4f6f5" />
<title>LIFTLOG Semantic Motion Mock</title>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--soft:#f0f4f1;--text:#17211b;--muted:#6c7770;--line:#d8dfda;--accent:#15803d;--accent-soft:#e6f3ea;--orange:#b45309;--ease:cubic-bezier(.2,.85,.25,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}svg{display:block}.phone{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--surface);padding-bottom:82px}.topbar{min-height:72px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:end;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:900;letter-spacing:-.04em}.date{color:var(--muted);font-size:13px}.menu{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.menu svg{width:24px;height:24px;transition:transform .22s var(--ease)}.menu:active svg{transform:scale(.88) rotate(4deg)}main{padding:0 16px 28px}.mode{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.mode button{position:relative;min-height:48px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:800}.mode button::after{content:"";position:absolute;left:24%;right:24%;bottom:-1px;height:3px;border-radius:999px;background:var(--accent);transform:scaleX(0);transition:transform .22s var(--ease)}.mode button.active{color:var(--accent)}.mode button.active::after{transform:scaleX(1)}.section{padding-top:18px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.1em;color:var(--accent)}h1,h2,p{margin:0}.current{margin:14px -16px 0;padding:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}.current-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.current h1{margin-top:3px;font-size:19px;line-height:1.25;letter-spacing:-.03em}.guide{min-height:44px;padding:0;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800}.guide .chev{transition:transform .22s var(--ease)}.guide.open .chev{transform:rotate(180deg)}.guide-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .24s var(--ease),opacity .18s ease}.guide-panel.open{grid-template-rows:1fr;opacity:1}.guide-inner{overflow:hidden;color:var(--muted);font-size:11px;line-height:1.55}.guide-box{padding:10px 0 2px;border-top:1px solid var(--line);margin-top:8px}.weight-row{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;padding:18px 0 7px}.round-step{width:52px;height:52px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-size:25px;transition:transform .12s ease,background .12s ease}.round-step:active{transform:scale(.9);background:var(--accent-soft)}.weight{text-align:center;font-size:44px;line-height:1;font-weight:950;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.weight small{margin-left:4px;color:var(--muted);font-size:14px;font-weight:700}.landmarks{text-align:center;color:var(--muted);font-size:10px}.landmarks b{color:var(--orange)}.setrep{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.counter{min-height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.counter+.counter{border-left:1px solid var(--line)}.counter button{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;transition:transform .12s ease}.counter button:active{transform:scale(.82)}.counter-value{text-align:center}.counter-value strong{display:block;font-size:23px}.counter-value span{display:block;margin-top:1px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.12em}.drop{width:100%;min-height:48px;margin-top:5px;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:800}.drop .plus{display:inline-grid;place-items:center;width:30px;height:30px;transition:transform .22s var(--ease)}.drop.active .plus{transform:rotate(45deg)}.drop-panel{height:0;overflow:hidden;opacity:0;transition:height .24s var(--ease),opacity .18s ease}.drop-panel.open{height:50px;opacity:1}.drop-inner{height:50px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.record{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:10px;background:var(--text);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .14s ease,background .22s ease}.record:active{transform:scale(.985)}.record.success{background:var(--accent)}.save-icon{width:21px;height:21px}.save-icon .disk,.save-icon .check{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.save-icon .disk{transition:opacity .16s ease,transform .22s var(--ease);transform-origin:center}.save-icon .check{stroke-dasharray:30;stroke-dashoffset:30;opacity:0;transition:stroke-dashoffset .28s var(--ease) .06s,opacity .12s ease}.record.success .disk{opacity:0;transform:scale(.7) rotate(-8deg)}.record.success .check{opacity:1;stroke-dashoffset:0}.session{padding-top:20px}.session-head{display:flex;justify-content:space-between;align-items:end;padding-bottom:8px}.session h2{font-size:17px}.session small{color:var(--muted);font-size:10px}.progress{color:var(--accent);font-size:13px;font-weight:900}.list{border-top:1px solid var(--line)}.row{min-height:60px;display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;border-bottom:1px solid var(--line)}.state{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:10px;font-weight:900}.row.done .state{border-color:var(--accent);background:var(--accent);color:#fff}.row-name{font-size:13px;font-weight:800}.row-meta{margin-top:2px;color:var(--muted);font-size:10px}.tag{font-size:10px;color:var(--muted)}.row.current .tag{color:var(--accent);font-weight:850}.bottom{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:78px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.nav{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:800}.nav.active{color:var(--accent)}.nav svg{width:25px;height:25px;overflow:visible}.nav path,.nav line,.nav rect,.nav polyline,.nav circle{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav .motion{transform-origin:center;transition:transform .26s var(--ease)}.nav .draw{stroke-dasharray:40;stroke-dashoffset:0}.nav.pulse .motion{animation:navPop .34s var(--ease)}.nav.history.pulse .motion{animation:history .38s var(--ease)}.nav.plan.pulse .page{animation:pageFlip .34s var(--ease)}.nav.body.pulse .beam{animation:scaleTilt .36s var(--ease)}.nav.pr.pulse .cup{animation:trophy .38s var(--ease)}.nav.stats .bar1,.nav.stats .bar2,.nav.stats .bar3{transform-origin:bottom}.nav.stats.pulse .bar1{animation:bars .35s var(--ease)}.nav.stats.pulse .bar2{animation:bars .35s var(--ease) .05s}.nav.stats.pulse .bar3{animation:bars .35s var(--ease) .1s}@keyframes navPop{0%{transform:scale(1)}45%{transform:scale(.83)}100%{transform:scale(1)}}@keyframes history{0%{transform:rotate(0)}50%{transform:rotate(-28deg)}100%{transform:rotate(0)}}@keyframes pageFlip{0%{transform:translateY(0)}45%{transform:translateY(-3px)}100%{transform:translateY(0)}}@keyframes scaleTilt{0%{transform:rotate(0)}40%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}100%{transform:rotate(0)}}@keyframes trophy{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-4px) scale(1.06)}100%{transform:translateY(0) scale(1)}}@keyframes bars{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}.toast{position:fixed;z-index:50;left:50%;bottom:92px;transform:translate(-50%,14px);padding:10px 14px;border-radius:999px;background:#17211b;color:#fff;font-size:11px;font-weight:800;opacity:0;pointer-events:none;transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0e1210;--surface:#151a17;--soft:#1b241e;--text:#edf4ef;--muted:#9aa69f;--line:#313a34;--accent:#58c77a;--accent-soft:#183422}.bottom{background:rgba(21,26,23,.95)}.record{background:#e7efe9;color:#152018}.record.success{background:var(--accent);color:#152018}}
</style>
</head>
<body>
<div class="phone">
<header class="topbar"><div class="brand">LIFTLOG</div><div class="date">2026/08/29</div><button class="menu" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
<main>
<nav class="mode"><button class="active">筋トレ</button><button>有酸素</button></nav>
<section class="current">
<div class="current-head"><div><div class="eyebrow">CURRENT EXERCISE</div><h1>インクラインダンベルプレス</h1></div><button class="guide" id="guide">フォーム解説 <span class="chev">⌄</span></button></div>
<div class="guide-panel" id="guidePanel"><div class="guide-inner"><div class="guide-box">肩甲骨を寄せたまま、肘を開きすぎず胸上部へ下ろします。補助情報なので操作時だけ展開。</div></div></div>
<div class="weight-row"><button class="round-step" id="minus">−</button><div class="weight"><span id="weight">28</span><small>kg</small></div><button class="round-step" id="plus">＋</button></div>
<div class="landmarks">前回 <b>28kg</b>　・　MAX 32kg</div>
<div class="setrep"><div class="counter"><button>−</button><div class="counter-value"><strong>3</strong><span>SET</span></div><button>＋</button></div><div class="counter"><button>−</button><div class="counter-value"><strong>10</strong><span>REP</span></div><button>＋</button></div></div>
<button class="drop" id="drop"><span>Drop Set</span><span class="plus">＋</span></button><div class="drop-panel" id="dropPanel"><div class="drop-inner"><span>D1　20kg × 10rep</span><span>編集</span></div></div>
<button class="record" id="record"><svg class="save-icon" viewBox="0 0 24 24"><path class="disk" d="M5 3h12l2 2v16H5zM8 3v6h8V3M8 14h8v7"/><path class="check" d="m5 12 4 4 10-10"/></svg><span id="recordLabel">この種目を記録</span></button>
</section>
<section class="session"><div class="session-head"><div><h2>今日のセッション</h2><small>予定と実施を同じ流れで確認</small></div><div class="progress">1 / 4</div></div><div class="list"><div class="row done"><span class="state">✓</span><div><div class="row-name">ベンチプレス</div><div class="row-meta">75kg・3 SET × 8 REP</div></div><span class="tag">実施済み</span></div><div class="row current"><span class="state">2</span><div><div class="row-name">インクラインダンベルプレス</div><div class="row-meta">前回 28kg・3 × 10</div></div><span class="tag">入力中</span></div><div class="row"><span class="state">3</span><div><div class="row-name">ダンベルフライ</div><div class="row-meta">前回 18kg・3 × 12</div></div><span class="tag">予定</span></div></div></section>
</main>
</div>
<nav class="bottom" aria-label="下部ナビゲーション">
<button class="nav active record-nav" data-name="記録"><svg viewBox="0 0 24 24"><g class="motion"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/></g></svg><span>記録</span></button>
<button class="nav plan" data-name="計画"><svg viewBox="0 0 24 24"><g class="motion page"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h2M14 13h2M8 17h2"/></g></svg><span>計画</span></button>
<button class="nav history" data-name="履歴"><svg viewBox="0 0 24 24"><g class="motion"><path d="M5 7H2v-3"/><path d="M3 7a9 9 0 1 1-1 6"/><path d="M12 7v5l3 2"/></g></svg><span>履歴</span></button>
<button class="nav body" data-name="体組成"><svg viewBox="0 0 24 24"><g class="motion"><path class="beam" d="M5 7h14"/><path d="M12 3v18M5 7l-3 6h6zM19 7l-3 6h6zM8 21h8"/></g></svg><span>体組成</span></button>
<button class="nav pr" data-name="PR"><svg viewBox="0 0 24 24"><g class="motion cup"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4M12 14v4M8 21h8M9 18h6"/></g></svg><span>PR</span></button>
<button class="nav stats" data-name="統計"><svg viewBox="0 0 24 24"><g class="motion"><path d="M4 20h16"/><line class="bar1" x1="7" y1="18" x2="7" y2="12"/><line class="bar2" x1="12" y1="18" x2="12" y2="7"/><line class="bar3" x1="17" y1="18" x2="17" y2="10"/></g></svg><span>統計</span></button>
</nav>
<div class="toast" id="toast">モーション再生</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const toast=$('#toast');let toastTimer;
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1300)}
$$('.mode button').forEach(b=>b.addEventListener('click',()=>{$$('.mode button').forEach(x=>x.classList.toggle('active',x===b));showToast(`${b.textContent}へ切替`)}));
$('#guide').addEventListener('click',()=>{const o=!$('#guidePanel').classList.contains('open');$('#guide').classList.toggle('open',o);$('#guidePanel').classList.toggle('open',o)});
$('#drop').addEventListener('click',()=>{const o=!$('#dropPanel').classList.contains('open');$('#drop').classList.toggle('active',o);$('#dropPanel').classList.toggle('open',o)});
$('#minus').addEventListener('click',()=>$('#weight').textContent=Math.max(0,Number($('#weight').textContent)-2));$('#plus').addEventListener('click',()=>$('#weight').textContent=Number($('#weight').textContent)+2);
$('#record').addEventListener('click',()=>{if($('#record').classList.contains('success'))return;$('#record').classList.add('success');$('#recordLabel').textContent='記録しました';showToast('保存 → チェックに変化');setTimeout(()=>{$('#record').classList.remove('success');$('#recordLabel').textContent='この種目を記録'},1500)});
$$('.nav').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');$$('.nav').forEach(x=>x.classList.toggle('active',x===b));showToast(`${b.dataset.name}：意味のある短いモーション`);setTimeout(()=>b.classList.remove('pulse'),500)}));
</script>
</body>
</html>
