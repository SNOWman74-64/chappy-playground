<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050706" />
  <title>LIFTLOG Exercise Bubble Map</title>
  <style>
    :root{color-scheme:dark;--bg:#050706;--ink:#f4f7f5;--muted:#8f9892;--panel:rgba(27,30,28,.91);--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-width:320px;min-height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit;color:inherit}
    .app{position:relative;width:min(100%,430px);height:100svh;margin:0 auto;overflow:hidden;background:#050706}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .topbar{position:absolute;z-index:20;inset:max(12px,env(safe-area-inset-top)) 14px auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;pointer-events:none}
    .round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,23,21,.84);box-shadow:0 9px 30px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.1);backdrop-filter:blur(12px);cursor:pointer;pointer-events:auto;font-size:24px}
    .brand{text-align:center;text-shadow:0 2px 18px #000}.brand small{display:block;color:rgba(255,255,255,.52);font-size:8px;font-weight:900;letter-spacing:.18em}.brand strong{display:block;margin-top:3px;font-size:14px;font-weight:900;letter-spacing:-.03em}
    .muscles{position:absolute;z-index:18;left:12px;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 59px);display:flex;gap:6px;overflow:auto;padding:3px 2px 12px;scrollbar-width:none;pointer-events:auto;mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
    .muscles::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:31px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(10,12,11,.62);color:rgba(255,255,255,.58);backdrop-filter:blur(10px);font-size:10px;font-weight:850;cursor:pointer}.chip.active{color:#fff;border-color:color-mix(in srgb,var(--c) 75%,white 25%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}.chip i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--c)}
    .tip{position:absolute;z-index:8;top:calc(max(12px,env(safe-area-inset-top)) + 107px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.42);font-size:9px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 12px #000;transition:opacity .2s}.tip.hide{opacity:0}
    .center-mark{position:absolute;z-index:7;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.13);border-radius:50%;pointer-events:none;opacity:.5}.center-mark:before,.center-mark:after{content:"";position:absolute;background:rgba(255,255,255,.12)}.center-mark:before{width:1px;height:26px;left:7px;top:-6px}.center-mark:after{height:1px;width:26px;top:7px;left:-6px}
    .detail{position:absolute;z-index:25;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));min-height:118px;padding:15px 78px 15px 17px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:var(--panel);box-shadow:0 20px 70px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(22px);transform:translateY(calc(100% + 32px));opacity:0;transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s;pointer-events:none}.detail.show{transform:translateY(0);opacity:1;pointer-events:auto}.eyebrow{color:var(--bubble-color,#79d89d);font-size:9px;font-weight:950;letter-spacing:.15em}.detail h1{margin:5px 0 0;font-size:21px;line-height:1.07;letter-spacing:-.045em}.meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;color:var(--muted);font-size:9px}.meta b{color:var(--ink);font-size:11px}.choose{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.13);font-size:26px;cursor:pointer}
    .badge{position:absolute;z-index:10;right:13px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 128px);padding:6px 9px;border-radius:999px;background:rgba(5,7,6,.62);color:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.08);font-size:8px;font-weight:800;backdrop-filter:blur(9px);pointer-events:none}
    .toast{position:absolute;z-index:40;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 144px);transform:translate(-50%,14px);padding:10px 14px;border-radius:999px;background:#f5f7f5;color:#101411;font-size:10px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media (min-width:431px){body{display:grid;place-items:center;background:#0c100e}.app{height:min(920px,calc(100svh - 32px));border:1px solid rgba(255,255,255,.12);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.32)}}
  </style>
</head>
<body>
<div class="app" id="app">
  <canvas id="canvas" aria-label="筋トレ種目を泡で探索するマップ"></canvas>
  <div class="topbar"><button class="round" id="back" aria-label="戻る">‹</button><div class="brand"><small>LIFTLOG LAB</small><strong>EXERCISE BUBBLE MAP</strong></div><button class="round" id="reset" aria-label="表示をリセット">⌕</button></div>
  <div class="muscles" id="muscles"></div>
  <div class="tip" id="tip">自由にドラッグ · 中央に寄せると少しズーム · タップで選択</div>
  <div class="center-mark" aria-hidden="true"></div>
  <div class="badge">PACKED / FREE PAN</div>
  <section class="detail" id="detail" aria-live="polite"><div class="eyebrow" id="detailPart">BACK · 背中</div><h1 id="detailName">ラットプルダウン</h1><div class="meta"><span>前回 <b id="detailPrev">72.5kg × 10</b></span><span>主力 <b id="detailRole">広背筋</b></span></div><button class="choose" id="choose" aria-label="この種目を選択">→</button></section>
  <div class="toast" id="toast">この種目を選択する想定です</div>
</div>
<script>
(()=>{
  const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),app=document.getElementById('app');
  const detail=document.getElementById('detail'),tip=document.getElementById('tip'),toast=document.getElementById('toast');
  const colors={胸:'#f66f65',背中:'#74baf0',肩:'#f0c95f',腕:'#bc91e5',脚:'#70d79d',体幹:'#6fd6d0'};
  const partEn={胸:'CHEST',背中:'BACK',肩:'SHOULDER',腕:'ARMS',脚:'LEGS',体幹:'CORE'};
  const data=[
    ['ベンチプレス','胸','胸全体','70kg × 8',78],['インクライン\nダンベルプレス','胸','上部胸','28kg × 10',82],['ダンベルフライ','胸','胸ストレッチ','18kg × 12',68],['チェストプレス','胸','胸全体','60kg × 10',70],['ケーブルクロス','胸','胸内側','22.5kg × 12',66],
    ['ラットプルダウン','背中','広背筋','72.5kg × 10',84],['シーテッドロー','背中','背中中央','60kg × 10',74],['ワンハンドロー','背中','広背筋','30kg × 10',72],['ストレートアーム\nプルダウン','背中','広背筋','30kg × 12',67],['ベントオーバーロー','背中','背中全体','55kg × 8',76],
    ['ショルダープレス','肩','前・中部','22kg × 7',76],['サイドレイズ','肩','中部','8kg × 16',72],['リアデルト\nマシン','肩','後部','47.5kg × 8',68],['フロントレイズ','肩','前部','8kg × 12',64],
    ['インクラインカール','腕','二頭','12kg × 7',72],['ケーブル\nプレスダウン','腕','三頭','27.5kg × 12',76],['ハンマーカール','腕','腕橈骨筋','12kg × 10',67],['スカルクラッシャー','腕','三頭','20kg × 10',66],
    ['スクワット','脚','脚全体','70kg × 8',84],['レッグ\nエクステンション','脚','大腿四頭筋','80kg × 15',79],['レッグカール','脚','ハム','75kg × 8',70],['ブルガリアン\nスクワット','脚','脚全体','20kg × 10',73],
    ['プランク','体幹','腹部','60秒',70],['ハンギング\nレッグレイズ','体幹','腹部','12rep',75],['アブローラー','体幹','腹部','10rep',68]
  ];

  const world={w:650,h:1620};
  const bubbles=[];
  const cols=[84,220,356,492,628];
  let y=165,index=0;
  const groupRows={胸:2,背中:2,肩:2,腕:2,脚:2,体幹:1};
  Object.keys(groupRows).forEach(part=>{
    const items=data.filter(d=>d[1]===part);
    let localRow=0,localCol=0;
    items.forEach((d,i)=>{
      const r=d[4];
      localRow=Math.floor(i/3); localCol=i%3;
      const x=[106,326,546][localCol] + (localRow%2?45:0);
      const yy=y+localRow*150;
      bubbles.push({id:index++,name:d[0],part:d[1],role:d[2],prev:d[3],r,baseR:r,x,y:yy,color:colors[d[1]],seed:Math.random()*10});
    });
    y+=Math.ceil(items.length/3)*150+32;
  });
  world.h=Math.max(1420,y+120);

  let W=0,H=0,dpr=1;
  const camera={x:world.w/2,y:510,tx:world.w/2,ty:510,vx:0,vy:0};
  let selected=null,filter=null,dragging=false,moved=false,lastX=0,lastY=0,startX=0,startY=0,toastTimer;

  function resize(){const r=app.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',resize);resize();

  function clampCamera(){const mx=W/2+35,my=H/2+35;camera.tx=Math.max(mx,Math.min(world.w-mx,camera.tx));camera.ty=Math.max(my,Math.min(world.h-my,camera.ty))}
  function worldToScreen(x,y){return{x:x-camera.x+W/2,y:y-camera.y+H/2}}
  function screenToWorld(x,y){return{x:x-W/2+camera.x,y:y-H/2+camera.y}}

  function buildChips(){const host=document.getElementById('muscles');Object.keys(colors).forEach(part=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',colors[part]);b.innerHTML=`<i></i>${part}`;b.onclick=()=>{filter=filter===part?null:part;selected=null;detail.classList.remove('show');[...host.children].forEach(el=>el.classList.toggle('active',el===b&&filter));if(filter){const ns=bubbles.filter(n=>n.part===filter);camera.tx=ns.reduce((s,n)=>s+n.x,0)/ns.length;camera.ty=ns.reduce((s,n)=>s+n.y,0)/ns.length;clampCamera()}};host.appendChild(b)})}buildChips();

  function focus(n){selected=n;camera.tx=n.x;camera.ty=n.y;clampCamera();document.getElementById('detailPart').textContent=`${partEn[n.part]} · ${n.part}`;document.getElementById('detailPart').style.color=n.color;document.getElementById('detailName').textContent=n.name.replace(/\n/g,' ');document.getElementById('detailPrev').textContent=n.prev;document.getElementById('detailRole').textContent=n.role;detail.style.setProperty('--bubble-color',n.color);detail.classList.add('show');tip.classList.add('hide')}

  function nearestToCenter(){let best=null,bestD=Infinity;for(const n of bubbles){if(filter&&n.part!==filter)continue;const p=worldToScreen(n.x,n.y),d=Math.hypot(p.x-W/2,p.y-H/2);if(d<bestD){bestD=d;best=n}}return best}

  function roundedBlobPath(n,r){const pts=20;ctx.beginPath();for(let i=0;i<pts;i++){const a=i/pts*Math.PI*2;const wobble=1+Math.sin(a*3+n.seed)*.018+Math.sin(a*5+n.seed*.7)*.012;const x=n.x+Math.cos(a)*r*wobble,y=n.y+Math.sin(a)*r*wobble;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath()}

  function drawBubble(n){if(filter&&n.part!==filter)return;const s=worldToScreen(n.x,n.y);const dist=Math.hypot(s.x-W/2,s.y-H/2);const centerBoost=Math.max(0,1-dist/210);const selectedBoost=selected===n?0.18:0;const scale=1+centerBoost*.10+selectedBoost;const r=n.baseR*scale;
    ctx.save();ctx.translate(W/2-camera.x,H/2-camera.y);
    roundedBlobPath(n,r);
    const grad=ctx.createLinearGradient(n.x-r,n.y-r,n.x+r,n.y+r);grad.addColorStop(0,lighten(n.color,18));grad.addColorStop(1,darken(n.color,8));ctx.fillStyle=grad;ctx.fill();
    if(selected===n){ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke()}
    ctx.restore();
    if(s.x<-r||s.x>W+r||s.y<-r||s.y>H+r)return;
    ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#0b0d0c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.max(11,Math.min(16,r*.18))}px Inter, Noto Sans JP, sans-serif`;wrapText(n.name.replace(/\n/g,' '),0,-2,r*1.45,Math.max(13,r*.21));ctx.restore();
  }

  function wrapText(text,x,y,maxWidth,lineHeight){const chars=[...text];let line='',lines=[];for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines=lines.slice(0,3);const total=(lines.length-1)*lineHeight;lines.forEach((l,i)=>ctx.fillText(l,x,y-total/2+i*lineHeight))}
  function hexToRgb(hex){const v=parseInt(hex.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255]}
  function lighten(hex,p){const [r,g,b]=hexToRgb(hex),q=p/100;return`rgb(${Math.round(r+(255-r)*q)},${Math.round(g+(255-g)*q)},${Math.round(b+(255-b)*q)})`}
  function darken(hex,p){const [r,g,b]=hexToRgb(hex),q=1-p/100;return`rgb(${Math.round(r*q)},${Math.round(g*q)},${Math.round(b*q)})`}

  function animate(){camera.x+=(camera.tx-camera.x)*.14;camera.y+=(camera.ty-camera.y)*.14;ctx.clearRect(0,0,W,H);for(const n of bubbles)drawBubble(n);requestAnimationFrame(animate)}animate();

  canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;canvas.setPointerCapture(e.pointerId);detail.classList.remove('show');selected=null});
  canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.hypot(e.clientX-startX,e.clientY-startY)>5)moved=true;camera.tx-=dx;camera.ty-=dy;camera.x=camera.tx;camera.y=camera.ty;lastX=e.clientX;lastY=e.clientY;clampCamera();tip.classList.add('hide')});
  canvas.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;canvas.releasePointerCapture(e.pointerId);if(!moved){const w=screenToWorld(e.clientX-app.getBoundingClientRect().left,e.clientY-app.getBoundingClientRect().top);let hit=null,best=Infinity;for(const n of bubbles){if(filter&&n.part!==filter)continue;const d=Math.hypot(w.x-n.x,w.y-n.y);if(d<n.baseR*1.25&&d<best){best=d;hit=n}}if(hit)focus(hit)}else{const near=nearestToCenter();if(near){selected=near;setTimeout(()=>{if(!dragging&&selected===near)focus(near)},120)}}});
  canvas.addEventListener('pointercancel',()=>dragging=false);

  document.getElementById('reset').onclick=()=>{filter=null;selected=null;camera.tx=world.w/2;camera.ty=510;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));detail.classList.remove('show');tip.classList.remove('hide')};
  document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='../';
  document.getElementById('choose').onclick=()=>{clearTimeout(toastTimer);toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)};
})();
</script>
</body>
</html>
