<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#050505" />
<title>Golf Shader / WebGL Port</title>
<style>
  :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;z-index:3;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
  .label{padding:9px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(5,5,5,.42);backdrop-filter:blur(14px);font-size:10px;font-weight:850;letter-spacing:.10em;color:rgba(255,255,255,.72)}
  .actions{display:flex;gap:8px;pointer-events:auto}
  button{min-width:46px;height:46px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(5,5,5,.46);color:#fff;backdrop-filter:blur(14px);font:700 12px/1 inherit;cursor:pointer}
  .source{position:fixed;z-index:4;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));max-height:55vh;overflow:auto;padding:15px 16px;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:rgba(6,6,6,.82);backdrop-filter:blur(22px);box-shadow:0 20px 70px rgba(0,0,0,.45);transform:translateY(calc(100% + 30px));opacity:0;transition:.25s ease;pointer-events:none}
  .source.show{transform:translateY(0);opacity:1;pointer-events:auto}
  .source small{display:block;margin-bottom:8px;color:rgba(255,255,255,.48);font-size:10px;font-weight:800;letter-spacing:.08em}
  pre{margin:0;white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dff5e8}
  .error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#090909;color:#ffb4a8;text-align:center;z-index:10;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <div class="label">GOLF SHADER · WEBGL PORT</div>
  <div class="actions"><button id="pause" aria-label="一時停止">Ⅱ</button><button id="code" aria-label="コード表示">{ }</button></div>
</div>
<section class="source" id="source"><small>ORIGINAL</small><pre>f z=2,d
@(40)
{
f3 p = z * nor(2*C.rgb - R.xyy),t=p
d=2; @(6) d+=d,
p += sin(p.zxy*d+z-T) / d
z += abs(1-len(p.xy))/3;
O += f4(1.1-cos(p),)/z/z/abs(len(t.xy)-1)
}
O = tanh(O / 30)</pre></section>
<div class="error" id="error"></div>
<script>
(() => {
  const canvas=document.getElementById('gl');
  const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
  const error=document.getElementById('error');
  if(!gl){error.style.display='grid';error.textContent='WebGL2 が利用できません。';return;}

  const vs=`#version 300 es
  in vec2 aPosition;
  void main(){ gl_Position=vec4(aPosition,0.0,1.0); }`;

  const fs=`#version 300 es
  precision highp float;
  uniform vec2 uResolution;
  uniform float uTime;
  out vec4 fragColor;

  vec4 tanh4(vec4 x){
    vec4 e=exp(-2.0*abs(x));
    return sign(x)*(1.0-e)/(1.0+e);
  }

  void main(){
    vec2 C=gl_FragCoord.xy;
    vec2 R=uResolution;
    float T=uTime;
    float z=2.0;
    float d=2.0;
    vec4 O=vec4(0.0);
    vec3 ray=normalize(vec3(2.0*C-R,-R.y));

    for(int i=0;i<40;i++){
      vec3 p=z*ray;
      vec3 t=p;
      d=2.0;
      for(int j=0;j<6;j++){
        d+=d;
        p+=sin(p.zxy*d+z-T)/d;
      }
      z+=abs(1.0-length(p.xy))/3.0;
      float ring=max(abs(length(t.xy)-1.0),0.0025);
      O+=vec4(1.1-cos(p),1.0)/(z*z*ring);
    }
    O=tanh4(O/30.0);
    fragColor=vec4(O.rgb,1.0);
  }`;

  function shader(type,src){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
    return s;
  }
  let program;
  try{
    program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program)||'program link failed');
  }catch(e){error.style.display='grid';error.textContent='Shader error\n'+e.message;return;}

  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.useProgram(program);
  const pos=gl.getAttribLocation(program,'aPosition');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
  const uResolution=gl.getUniformLocation(program,'uResolution');
  const uTime=gl.getUniformLocation(program,'uTime');

  let paused=false,base=performance.now(),pausedAt=0,pauseAccum=0;
  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    const w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
  }
  function frame(now){
    resize();
    const t=(paused?pausedAt:now)-base-pauseAccum;
    gl.useProgram(program);
    gl.uniform2f(uResolution,canvas.width,canvas.height);
    gl.uniform1f(uTime,t*0.001);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('pause').onclick=()=>{
    const now=performance.now();
    if(!paused){paused=true;pausedAt=now;document.getElementById('pause').textContent='▶';}
    else{pauseAccum+=now-pausedAt;paused=false;document.getElementById('pause').textContent='Ⅱ';}
  };
  const source=document.getElementById('source');
  document.getElementById('code').onclick=()=>source.classList.toggle('show');
  source.onclick=()=>source.classList.remove('show');
})();
</script>
</body>
</html>
