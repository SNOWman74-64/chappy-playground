name: Publish Pages and Palico read snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Test read snapshot builder
        run: node --test mhxx-palico/scripts/*.test.mjs
      - name: Prepare existing site and fresh read snapshot
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"
          node mhxx-palico/scripts/build-read-snapshot.mjs "$RUNNER_TEMP/pages-site/mhxx-palico/read"
      - name: Commit JSON-only read cache when data changed
        shell: bash
        run: |
          node mhxx-palico/scripts/sync-read-cache.mjs "$RUNNER_TEMP/pages-site/mhxx-palico/read/palicos.json" mhxx-palico/read-cache/palicos.json
          git add -- mhxx-palico/read-cache/palicos.json
          if ! git diff --cached --quiet -- mhxx-palico/read-cache/palicos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync Palico read cache"
            git push origin HEAD:main
          fi
          mkdir -p "$RUNNER_TEMP/pages-site/mhxx-palico/read-cache"
          cp mhxx-palico/read-cache/palicos.json "$RUNNER_TEMP/pages-site/mhxx-palico/read-cache/palicos.json"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy existing site and read snapshot
        id: deployment
        uses: actions/deploy-pages@v5.0.1
