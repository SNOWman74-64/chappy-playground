<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fidget Room - Stress Relief</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #07111f;
      --panel: rgba(15, 23, 42, .74);
      --line: rgba(255, 255, 255, .10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background:
        radial-gradient(circle at 15% 0%, rgba(56, 189, 248, .17), transparent 31%),
        radial-gradient(circle at 90% 12%, rgba(167, 139, 250, .18), transparent 34%),
        linear-gradient(180deg, #0b1728 0%, #07111f 66%, #050b15 100%);
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 10px;
      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(10px, env(safe-area-inset-bottom));
    }

    .topbar {
      min-height: 42px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(15, 23, 42, .62);
      box-shadow: inset 0 1px rgba(255,255,255,.05);
      text-decoration: none;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(.95);
    }

    .title-wrap {
      text-align: center;
      min-width: 0;
    }

    .eyebrow {
      display: block;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 1px 0 0;
      font-size: 19px;
      letter-spacing: -.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(8, 16, 30, .64);
      backdrop-filter: blur(14px);
    }

    .tab {
      min-width: 0;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .12s ease;
    }

    .tab:active {
      transform: scale(.96);
    }

    .tab.active {
      background: rgba(255, 255, 255, .10);
      color: #fff;
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    .stage-shell {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 42%),
        rgba(8, 15, 28, .72);
      box-shadow: 0 22px 80px rgba(0,0,0,.26), inset 0 1px rgba(255,255,255,.04);
      backdrop-filter: blur(18px);
    }

    .mode {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      padding: clamp(14px, 4vw, 20px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(.992);
      transition: opacity .18s ease, transform .18s ease;
    }

    .mode.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .mode-copy {
      text-align: center;
      pointer-events: none;
    }

    .mode-copy strong {
      display: block;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .mode-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .play-area {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    /* Pop It */
    .pop-board {
      width: min(100%, 340px);
      aspect-ratio: 5 / 6;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(7px, 2.5vw, 11px);
      padding: clamp(12px, 3vw, 18px);
      border-radius: 31px;
      background: linear-gradient(150deg, rgba(125, 211, 252, .24), rgba(167, 139, 250, .24));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 8px 28px rgba(255,255,255,.05), inset 0 -18px 30px rgba(0,0,0,.18);
    }

    .pop-dot {
      position: relative;
      min-width: 0;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #66d6f5, #7067ed);
      box-shadow:
        inset 7px 7px 10px rgba(255,255,255,.21),
        inset -8px -9px 13px rgba(18,23,72,.34),
        0 7px 12px rgba(0,0,0,.25);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .pop-dot:nth-child(4n+2) { background: linear-gradient(145deg, #8bdbf6, #8a6fec); }
    .pop-dot:nth-child(4n+3) { background: linear-gradient(145deg, #91e4d0, #4f92e9); }
    .pop-dot:nth-child(4n+4) { background: linear-gradient(145deg, #b9a6fb, #5577ea); }

    .pop-dot.pressed {
      transform: scale(.90);
      filter: saturate(.76) brightness(.78);
      box-shadow:
        inset -5px -6px 10px rgba(255,255,255,.08),
        inset 8px 9px 18px rgba(3,7,18,.52),
        0 2px 4px rgba(0,0,0,.12);
    }

    /* Bubble wrap */
    .bubble-sheet {
      width: min(100%, 350px);
      height: min(100%, 430px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-content: center;
      gap: clamp(6px, 2vw, 10px);
      padding: 14px;
      border-radius: 27px;
      background: linear-gradient(160deg, rgba(219, 234, 254, .11), rgba(125, 211, 252, .06));
      border: 1px solid rgba(224,242,254,.14);
    }

    .bubble {
      aspect-ratio: 1;
      border: 1px solid rgba(224, 242, 254, .24);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 27%, rgba(255,255,255,.55) 0 8%, transparent 9%),
        radial-gradient(circle at 40% 35%, rgba(186,230,253,.23), rgba(56,189,248,.09) 58%, rgba(14,116,144,.12));
      box-shadow:
        inset -7px -9px 12px rgba(8,47,73,.16),
        inset 5px 6px 10px rgba(255,255,255,.13),
        0 5px 9px rgba(0,0,0,.13);
      transition: transform .10s ease, opacity .12s ease, filter .12s ease;
    }

    .bubble.popped {
      transform: scale(.73);
      opacity: .34;
      filter: grayscale(.8);
      box-shadow: inset 3px 3px 7px rgba(0,0,0,.32);
    }

    /* Stress ball */
    .ball-zone {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .stress-ball {
      width: min(58vw, 230px);
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      transform-origin: 50% 72%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.48), transparent 12%),
        radial-gradient(circle at 42% 36%, #9ae6b4 0 12%, #34d399 48%, #059669 100%);
      box-shadow:
        inset -22px -25px 30px rgba(3,78,61,.32),
        inset 13px 15px 26px rgba(255,255,255,.10),
        0 35px 48px rgba(0,0,0,.27);
      transition: transform .16s cubic-bezier(.2,.9,.2,1), border-radius .16s ease, filter .16s ease;
      touch-action: none;
    }

    .stress-ball::after {
      content: "HOLD";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .15em;
      color: rgba(236,253,245,.78);
      text-shadow: 0 1px 12px rgba(4,120,87,.8);
    }

    .stress-ball.squeeze {
      transform: scaleX(1.18) scaleY(.72) translateY(20px);
      border-radius: 45% 55% 44% 56% / 60% 60% 40% 40%;
      filter: saturate(1.2) brightness(.92);
    }

    .ball-shadow {
      position: absolute;
      width: min(49vw, 190px);
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,.28);
      filter: blur(9px);
      transform: translateY(min(35vw, 135px));
      transition: transform .16s ease, width .16s ease, opacity .16s ease;
    }

    .ball-zone.squeezing .ball-shadow {
      width: min(64vw, 250px);
      transform: translateY(min(31vw, 119px));
      opacity: .45;
    }

    /* Spinner */
    .spinner-zone {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      touch-action: none;
    }

    .spinner {
      width: min(62vw, 245px);
      aspect-ratio: 1;
      position: relative;
      will-change: transform;
      filter: drop-shadow(0 25px 30px rgba(0,0,0,.32));
    }

    .spinner-arm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      height: 30%;
      border-radius: 999px;
      background: linear-gradient(135deg, #64748b, #cbd5e1 45%, #475569);
      transform-origin: 0 50%;
      box-shadow: inset 0 2px rgba(255,255,255,.28), inset 0 -4px 8px rgba(15,23,42,.32);
    }

    .spinner-arm:nth-child(1) { transform: translateY(-50%) rotate(0deg); }
    .spinner-arm:nth-child(2) { transform: translateY(-50%) rotate(120deg); }
    .spinner-arm:nth-child(3) { transform: translateY(-50%) rotate(240deg); }

    .spinner-arm::after {
      content: "";
      position: absolute;
      right: 7%;
      top: 50%;
      width: 39%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle, #0f172a 0 29%, #94a3b8 31% 48%, #334155 51% 100%);
      box-shadow: inset 0 1px 5px rgba(255,255,255,.26);
    }

    .spinner-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #e2e8f0, #64748b 58%, #1e293b 100%);
      border: 4px solid rgba(15,23,42,.72);
      box-shadow: inset 0 2px 6px rgba(255,255,255,.25), 0 7px 17px rgba(0,0,0,.3);
      z-index: 2;
    }

    .spin-hint {
      position: absolute;
      bottom: 9%;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }

    .footer-controls {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #64748b;
      font-size: 10px;
    }

    .status {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-btn {
      flex: 0 0 auto;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, .62);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .mini-btn:active {
      transform: scale(.96);
    }

    @media (max-height: 690px) {
      .app { gap: 7px; padding-top: max(7px, env(safe-area-inset-top)); }
      .topbar { min-height: 36px; }
      .icon-btn { width: 36px; height: 36px; border-radius: 12px; }
      h1 { font-size: 16px; }
      .tabs { padding: 4px; }
      .tab { height: 36px; font-size: 10px; }
      .mode { padding: 11px; gap: 5px; }
      .mode-copy strong { font-size: 15px; }
      .mode-copy span { font-size: 10px; }
      .pop-board { width: min(100%, 275px); }
      .bubble-sheet { width: min(100%, 300px); height: min(100%, 350px); }
      .stress-ball { width: min(45vw, 180px); }
      .spinner { width: min(48vw, 190px); }
      .footer-controls { min-height: 34px; }
      .mini-btn { height: 32px; }
    }

    @media (min-width: 700px) {
      .app {
        width: min(100%, 520px);
        margin: 0 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="icon-btn" href="../" aria-label="Playgroundへ戻る">←</a>
      <div class="title-wrap">
        <span class="eyebrow">Chappy Playground #01</span>
        <h1>Fidget Room</h1>
      </div>
      <button class="icon-btn" id="soundButton" type="button" aria-label="サウンド切替">♪</button>
    </header>

    <nav class="tabs" aria-label="ストレス解消グッズ">
      <button class="tab active" type="button" data-mode="pop">Pop It</button>
      <button class="tab" type="button" data-mode="bubble">プチプチ</button>
      <button class="tab" type="button" data-mode="ball">ボール</button>
      <button class="tab" type="button" data-mode="spinner">スピナー</button>
    </nav>

    <section class="stage-shell">
      <section class="mode active" data-panel="pop">
        <div class="mode-copy">
          <strong>Pop It</strong>
          <span>好きなだけ押す。全部押したらもう一周。</span>
        </div>
        <div class="play-area">
          <div class="pop-board" id="popBoard" aria-label="Pop It"></div>
        </div>
      </section>

      <section class="mode" data-panel="bubble">
        <div class="mode-copy">
          <strong>無限プチプチ</strong>
          <span>指でなぞって連続で潰してもOK。</span>
        </div>
        <div class="play-area">
          <div class="bubble-sheet" id="bubbleSheet" aria-label="無限プチプチ"></div>
        </div>
      </section>

      <section class="mode" data-panel="ball">
        <div class="mode-copy">
          <strong>にぎるストレスボール</strong>
          <span>ボールを長押し。離すとむにっと戻る。</span>
        </div>
        <div class="play-area">
          <div class="ball-zone" id="ballZone">
            <div class="ball-shadow"></div>
            <div class="stress-ball" id="stressBall" role="button" aria-label="ストレスボール"></div>
          </div>
        </div>
      </section>

      <section class="mode" data-panel="spinner">
        <div class="mode-copy">
          <strong>フィジェットスピナー</strong>
          <span>左右にシュッと弾く。速く弾くほど長く回る。</span>
        </div>
        <div class="play-area">
          <div class="spinner-zone" id="spinnerZone">
            <div class="spinner" id="spinner" aria-label="フィジェットスピナー">
              <div class="spinner-arm"></div>
              <div class="spinner-arm"></div>
              <div class="spinner-arm"></div>
              <div class="spinner-center"></div>
            </div>
            <div class="spin-hint">← SWIPE →</div>
          </div>
        </div>
      </section>
    </section>

    <footer class="footer-controls">
      <span class="status" id="status">30 POPS READY</span>
      <button class="mini-btn" id="resetButton" type="button">RESET</button>
    </footer>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('.mode')];
    const status = document.querySelector('#status');
    const resetButton = document.querySelector('#resetButton');
    const soundButton = document.querySelector('#soundButton');

    let currentMode = 'pop';
    let soundEnabled = true;
    let audioContext = null;

    const vibrate = (pattern = 8) => {
      if ('vibrate' in navigator) navigator.vibrate(pattern);
    };

    const getAudioContext = () => {
      if (!soundEnabled) return null;
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    };

    const ping = (kind = 'tap') => {
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      const map = {
        tap: [220, 120, .035, .045],
        pop: [150, 55, .055, .065],
        squish: [92, 58, .085, .05],
        spin: [430, 260, .028, .028]
      };
      const [start, end, duration, volume] = map[kind] || map.tap;

      osc.type = kind === 'spin' ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(start, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, end), now + duration);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    };

    soundButton.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundButton.textContent = soundEnabled ? '♪' : '×';
      soundButton.setAttribute('aria-label', soundEnabled ? 'サウンドON' : 'サウンドOFF');
      if (soundEnabled) ping('tap');
    });

    const setMode = (mode) => {
      currentMode = mode;
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
      panels.forEach(panel => panel.classList.toggle('active', panel.dataset.panel === mode));
      updateStatus();
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        setMode(tab.dataset.mode);
        ping('tap');
        vibrate(5);
      });
    });

    /* Pop It */
    const popBoard = document.querySelector('#popBoard');
    const popDots = [];

    for (let i = 0; i < 30; i += 1) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'pop-dot';
      dot.setAttribute('aria-label', `Pop ${i + 1}`);
      dot.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (dot.classList.contains('pressed')) return;
        dot.classList.add('pressed');
        ping('tap');
        vibrate(7);
        updateStatus();
        if (popDots.every(item => item.classList.contains('pressed'))) {
          setTimeout(() => resetPop(true), 320);
        }
      });
      popDots.push(dot);
      popBoard.appendChild(dot);
    }

    const resetPop = (silent = false) => {
      popDots.forEach(dot => dot.classList.remove('pressed'));
      if (!silent) {
        ping('tap');
        vibrate(6);
      }
      updateStatus();
    };

    /* Bubble wrap */
    const bubbleSheet = document.querySelector('#bubbleSheet');
    const bubbles = [];

    const popBubble = (bubble) => {
      if (bubble.classList.contains('popped')) return;
      bubble.classList.add('popped');
      ping('pop');
      vibrate(6);
      updateStatus();
      if (bubbles.every(item => item.classList.contains('popped'))) {
        setTimeout(() => resetBubbles(true), 420);
      }
    };

    for (let i = 0; i < 36; i += 1) {
      const bubble = document.createElement('button');
      bubble.type = 'button';
      bubble.className = 'bubble';
      bubble.setAttribute('aria-label', `Bubble ${i + 1}`);
      bubble.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        bubble.setPointerCapture?.(event.pointerId);
        popBubble(bubble);
      });
      bubbles.push(bubble);
      bubbleSheet.appendChild(bubble);
    }

    bubbleSheet.addEventListener('pointermove', (event) => {
      if (event.buttons === 0 && event.pointerType === 'mouse') return;
      const target = document.elementFromPoint(event.clientX, event.clientY);
      if (target?.classList.contains('bubble')) popBubble(target);
    });

    const resetBubbles = (silent = false) => {
      bubbles.forEach(bubble => bubble.classList.remove('popped'));
      if (!silent) {
        ping('tap');
        vibrate(6);
      }
      updateStatus();
    };

    /* Stress ball */
    const stressBall = document.querySelector('#stressBall');
    const ballZone = document.querySelector('#ballZone');
    let squeezing = false;
    let squeezeStartedAt = 0;

    const squeezeStart = (event) => {
      event.preventDefault();
      if (squeezing) return;
      squeezing = true;
      squeezeStartedAt = performance.now();
      stressBall.classList.add('squeeze');
      ballZone.classList.add('squeezing');
      stressBall.setPointerCapture?.(event.pointerId);
      ping('squish');
      vibrate(12);
      updateStatus();
    };

    const squeezeEnd = () => {
      if (!squeezing) return;
      const heldMs = performance.now() - squeezeStartedAt;
      squeezing = false;
      stressBall.classList.remove('squeeze');
      ballZone.classList.remove('squeezing');
      if (heldMs > 350) vibrate([5, 30, 5]);
      updateStatus();
    };

    stressBall.addEventListener('pointerdown', squeezeStart);
    stressBall.addEventListener('pointerup', squeezeEnd);
    stressBall.addEventListener('pointercancel', squeezeEnd);
    stressBall.addEventListener('lostpointercapture', squeezeEnd);

    /* Spinner */
    const spinnerZone = document.querySelector('#spinnerZone');
    const spinner = document.querySelector('#spinner');
    let spinAngle = 0;
    let spinVelocity = 0;
    let spinLastFrame = performance.now();
    let dragStartX = 0;
    let dragStartTime = 0;
    let draggingSpinner = false;

    const animateSpinner = (now) => {
      const dt = Math.min(32, now - spinLastFrame) / 16.667;
      spinLastFrame = now;
      spinAngle += spinVelocity * dt;
      spinVelocity *= Math.pow(.986, dt);
      if (Math.abs(spinVelocity) < .01) spinVelocity = 0;
      spinner.style.transform = `rotate(${spinAngle}deg)`;
      requestAnimationFrame(animateSpinner);
    };
    requestAnimationFrame(animateSpinner);

    spinnerZone.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      draggingSpinner = true;
      dragStartX = event.clientX;
      dragStartTime = performance.now();
      spinnerZone.setPointerCapture?.(event.pointerId);
    });

    spinnerZone.addEventListener('pointermove', (event) => {
      if (!draggingSpinner) return;
      event.preventDefault();
      const dx = event.movementX || 0;
      spinAngle += dx * .75;
    });

    const releaseSpinner = (event) => {
      if (!draggingSpinner) return;
      draggingSpinner = false;
      const dt = Math.max(45, performance.now() - dragStartTime);
      const dx = event.clientX - dragStartX;
      spinVelocity = Math.max(-34, Math.min(34, (dx / dt) * 16));
      if (Math.abs(spinVelocity) < 3) spinVelocity = Math.sign(spinVelocity || dx || 1) * 6;
      ping('spin');
      vibrate(6);
      updateStatus();
    };

    spinnerZone.addEventListener('pointerup', releaseSpinner);
    spinnerZone.addEventListener('pointercancel', releaseSpinner);

    const updateStatus = () => {
      if (currentMode === 'pop') {
        const done = popDots.filter(dot => dot.classList.contains('pressed')).length;
        status.textContent = `${30 - done} POPS LEFT`;
      } else if (currentMode === 'bubble') {
        const done = bubbles.filter(bubble => bubble.classList.contains('popped')).length;
        status.textContent = `${done} / ${bubbles.length} POPPED`;
      } else if (currentMode === 'ball') {
        status.textContent = squeezing ? 'SQUEEZE...' : 'PRESS & HOLD';
      } else {
        const speed = Math.round(Math.abs(spinVelocity));
        status.textContent = speed > 0 ? `SPIN SPEED ${speed}` : 'FLICK TO SPIN';
      }
    };

    const resetCurrent = () => {
      if (currentMode === 'pop') resetPop();
      if (currentMode === 'bubble') resetBubbles();
      if (currentMode === 'ball') {
        squeezeEnd();
        ping('tap');
      }
      if (currentMode === 'spinner') {
        spinVelocity = 0;
        spinAngle = 0;
        spinner.style.transform = 'rotate(0deg)';
        ping('tap');
      }
      updateStatus();
    };

    resetButton.addEventListener('click', resetCurrent);

    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
    window.addEventListener('resize', () => window.scrollTo(0, 0));

    updateStatus();
  </script>
</body>
</html>
