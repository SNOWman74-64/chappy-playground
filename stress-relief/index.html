<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#08111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fidget Room</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg:#06101c; --panel:rgba(12,22,38,.78); --line:rgba(255,255,255,.10);
      --text:#f8fafc; --muted:#8da0b8; --accent:#7dd3fc;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--bg); -webkit-text-size-adjust:100%; }
    body {
      color:var(--text); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none;
      background:radial-gradient(circle at 12% 0%,rgba(56,189,248,.16),transparent 32%),radial-gradient(circle at 92% 10%,rgba(167,139,250,.16),transparent 34%),linear-gradient(180deg,#0b1727 0%,#06101c 72%,#040912 100%);
    }
    button,a { font:inherit; color:inherit; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
    button { border:0; }
    .app { height:100dvh; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:9px; padding:max(9px,env(safe-area-inset-top)) 11px max(9px,env(safe-area-inset-bottom)); }
    .topbar { min-height:42px; display:grid; grid-template-columns:42px 1fr 42px; align-items:center; gap:8px; }
    .icon-btn { width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--line); border-radius:14px; background:rgba(15,23,42,.62); text-decoration:none; }
    .title { text-align:center; min-width:0; }
    .title small { display:block; color:var(--accent); font-size:9px; font-weight:900; letter-spacing:.14em; }
    .title strong { display:block; margin-top:1px; font-size:18px; }
    .tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; padding:4px; border:1px solid var(--line); border-radius:16px; background:rgba(8,16,30,.7); }
    .tab { min-width:0; height:40px; border-radius:11px; background:transparent; color:var(--muted); font-size:10px; font-weight:800; }
    .tab.active { background:rgba(255,255,255,.10); color:#fff; }
    .stage { min-height:0; position:relative; overflow:hidden; border:1px solid var(--line); border-radius:26px; background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.055),transparent 42%),rgba(8,15,28,.74); }
    .mode { position:absolute; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:6px; padding:14px; opacity:0; pointer-events:none; transform:translateY(8px) scale(.99); transition:.18s ease; }
    .mode.active { opacity:1; pointer-events:auto; transform:none; }
    .mode-copy { text-align:center; pointer-events:none; }
    .mode-copy strong { display:block; font-size:17px; }
    .mode-copy span { display:block; margin-top:2px; color:var(--muted); font-size:10px; line-height:1.35; }
    .play { min-height:0; display:grid; place-items:center; touch-action:none; }
    .footer { min-height:34px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:10px; }

    .pop-board { width:min(100%,330px); aspect-ratio:5/6; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:14px; border-radius:28px; background:linear-gradient(145deg,rgba(56,189,248,.22),rgba(139,92,246,.22)); }
    .pop { aspect-ratio:1; border-radius:50%; background:linear-gradient(145deg,#7dd3fc,#7568ed); box-shadow:inset 7px 7px 10px rgba(255,255,255,.2),inset -8px -9px 13px rgba(18,23,72,.35),0 7px 12px rgba(0,0,0,.22); transition:.1s ease; }
    .pop.pressed { transform:scale(.88); filter:brightness(.75); box-shadow:inset 8px 9px 18px rgba(3,7,18,.5); }

    .bubble-sheet { width:min(100%,345px); height:min(100%,420px); display:grid; grid-template-columns:repeat(6,1fr); align-content:center; gap:7px; padding:13px; border:1px solid rgba(224,242,254,.14); border-radius:26px; background:rgba(186,230,253,.06); }
    .bubble { aspect-ratio:1; border-radius:50%; border:1px solid rgba(224,242,254,.24); background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55) 0 8%,transparent 9%),radial-gradient(circle,rgba(125,211,252,.18),rgba(14,116,144,.11)); box-shadow:inset -7px -9px 12px rgba(8,47,73,.16),0 5px 9px rgba(0,0,0,.13); transition:.1s ease; }
    .bubble.popped { transform:scale(.7); opacity:.3; filter:grayscale(1); }

    .ball-zone { width:100%; height:100%; display:grid; place-items:center; position:relative; }
    .ball-shadow { position:absolute; width:min(48vw,185px); height:28px; border-radius:50%; background:rgba(0,0,0,.3); filter:blur(9px); transform:translateY(min(35vw,132px)); transition:.15s ease; }
    .stress-ball { width:min(58vw,225px); aspect-ratio:1; border-radius:50%; position:relative; background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.48),transparent 12%),radial-gradient(circle at 42% 36%,#9ae6b4,#34d399 48%,#059669); box-shadow:inset -22px -25px 30px rgba(3,78,61,.32),0 35px 48px rgba(0,0,0,.27); transition:.14s ease; }
    .stress-ball::after { content:"HOLD"; position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:900; letter-spacing:.15em; color:rgba(236,253,245,.78); }
    .stress-ball.squeeze { transform:scaleX(1.18) scaleY(.72) translateY(18px); border-radius:45% 55% 44% 56%/60% 60% 40% 40%; }
    .ball-zone.squeezing .ball-shadow { width:min(63vw,245px); transform:translateY(min(31vw,116px)); }

    .spinner-zone { width:100%; height:100%; display:grid; place-items:center; position:relative; }
    .spinner { width:min(62vw,240px); aspect-ratio:1; position:relative; will-change:transform; filter:drop-shadow(0 25px 30px rgba(0,0,0,.32)); }
    .arm { position:absolute; left:50%; top:50%; width:44%; height:30%; border-radius:999px; background:linear-gradient(135deg,#64748b,#cbd5e1 45%,#475569); transform-origin:0 50%; }
    .arm:nth-child(1){transform:translateY(-50%) rotate(0deg)} .arm:nth-child(2){transform:translateY(-50%) rotate(120deg)} .arm:nth-child(3){transform:translateY(-50%) rotate(240deg)}
    .arm::after { content:""; position:absolute; right:7%; top:50%; width:39%; aspect-ratio:1; border-radius:50%; transform:translateY(-50%); background:radial-gradient(circle,#0f172a 0 29%,#94a3b8 31% 48%,#334155 51%); }
    .center { position:absolute; left:50%; top:50%; width:30%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle at 38% 34%,#e2e8f0,#64748b 58%,#1e293b); border:4px solid rgba(15,23,42,.72); z-index:2; }

    .keyboard { width:min(100%,360px); padding:12px; border-radius:22px; background:linear-gradient(180deg,#151b23,#0b1017); border:1px solid rgba(255,255,255,.08); box-shadow:0 22px 45px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.05); }
    .key-row { display:grid; gap:6px; margin-bottom:6px; grid-template-columns:repeat(10,1fr); }
    .key-row:last-child { margin-bottom:0; }
    .key { min-width:0; height:42px; border-radius:8px; background:linear-gradient(180deg,#3a424c,#222831); color:#e5edf5; font-size:11px; font-weight:800; box-shadow:inset 0 1px rgba(255,255,255,.12),0 5px 0 #11161d,0 7px 10px rgba(0,0,0,.25); transform:translateY(0); transition:transform .035s ease,box-shadow .035s ease,background .035s ease; }
    .key:active,.key.down { transform:translateY(4px); box-shadow:inset 0 1px rgba(255,255,255,.06),0 1px 0 #11161d; background:linear-gradient(180deg,#2b323b,#1d232a); }
    .key.wide { grid-column:span 2; } .key.space { grid-column:span 5; }
    @media (max-width:350px){ .key{height:38px;font-size:10px}.keyboard{padding:9px}.key-row{gap:4px;margin-bottom:4px} }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="icon-btn" href="../" aria-label="戻る">‹</a>
      <div class="title"><small>STRESS RELIEF</small><strong>Fidget Room</strong></div>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音の切り替え">♪</button>
    </header>

    <nav class="tabs" aria-label="フィジェット切り替え">
      <button class="tab active" data-mode="pop" type="button">Pop</button>
      <button class="tab" data-mode="bubble" type="button">Bubble</button>
      <button class="tab" data-mode="ball" type="button">Ball</button>
      <button class="tab" data-mode="spinner" type="button">Spin</button>
      <button class="tab" data-mode="keys" type="button">Keys</button>
    </nav>

    <section class="stage">
      <section class="mode active" data-panel="pop"><div class="mode-copy"><strong>Pop It</strong><span>タップして全部へこませる</span></div><div class="play"><div class="pop-board" id="popBoard"></div></div></section>
      <section class="mode" data-panel="bubble"><div class="mode-copy"><strong>Bubble Wrap</strong><span>無限プチプチ。全部割ると復活</span></div><div class="play"><div class="bubble-sheet" id="bubbleSheet"></div></div></section>
      <section class="mode" data-panel="ball"><div class="mode-copy"><strong>Stress Ball</strong><span>押している間だけ、ぎゅっと潰れる</span></div><div class="play"><div class="ball-zone" id="ballZone"><div class="ball-shadow"></div><button class="stress-ball" id="stressBall" type="button" aria-label="ストレスボール"></button></div></div></section>
      <section class="mode" data-panel="spinner"><div class="mode-copy"><strong>Fidget Spinner</strong><span>指で横に弾くと回る</span></div><div class="play"><div class="spinner-zone" id="spinnerZone"><div class="spinner" id="spinner"><i class="arm"></i><i class="arm"></i><i class="arm"></i><i class="center"></i></div></div></div></section>
      <section class="mode" data-panel="keys"><div class="mode-copy"><strong>Mechanical Keys</strong><span>カチッ、コトッ。好きなだけ連打</span></div><div class="play"><div class="keyboard" id="keyboard"></div></div></section>
    </section>

    <footer class="footer">tap · press · flick · no scroll</footer>
  </main>

  <script>
    let soundOn = true;
    let audioCtx = null;
    const soundBtn = document.querySelector('#soundBtn');
    const getAudio = () => {
      if (!soundOn) return null;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    };
    const vibrate = ms => { try { navigator.vibrate?.(ms); } catch (_) {} };
    function blip(freq=180,duration=.06,volume=.08,type='sine'){
      const c=getAudio(); if(!c)return; const o=c.createOscillator(),g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,c.currentTime); g.gain.setValueAtTime(volume,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+duration);
    }
    function noise(duration=.025,volume=.035){
      const c=getAudio(); if(!c)return; const len=Math.max(1,Math.floor(c.sampleRate*duration)); const b=c.createBuffer(1,len,c.sampleRate); const d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
      const s=c.createBufferSource(),g=c.createGain(); s.buffer=b; g.gain.value=volume; s.connect(g).connect(c.destination); s.start();
    }
    function mechanical(isWide=false){
      const base=isWide?105:125; blip(base+Math.random()*18,.055,isWide?.065:.05,'triangle'); noise(.018,isWide?.055:.045); setTimeout(()=>blip((isWide?190:230)+Math.random()*35,.026,.025,'square'),8);
    }
    soundBtn.addEventListener('click',()=>{ soundOn=!soundOn; soundBtn.textContent=soundOn?'♪':'×'; if(soundOn) getAudio(); });

    const tabs=[...document.querySelectorAll('.tab')]; const panels=[...document.querySelectorAll('.mode')];
    tabs.forEach(t=>t.addEventListener('click',()=>{ tabs.forEach(x=>x.classList.toggle('active',x===t)); panels.forEach(p=>p.classList.toggle('active',p.dataset.panel===t.dataset.mode)); blip(260,.025,.025,'triangle'); }));

    const popBoard=document.querySelector('#popBoard');
    for(let i=0;i<30;i++){ const b=document.createElement('button'); b.type='button'; b.className='pop'; b.setAttribute('aria-label','Pop'); b.addEventListener('click',()=>{ b.classList.toggle('pressed'); blip(b.classList.contains('pressed')?150:210,.045,.05,'sine'); vibrate(8); }); popBoard.appendChild(b); }

    const bubbleSheet=document.querySelector('#bubbleSheet'); let popped=0;
    function resetBubbles(){ popped=0; [...bubbleSheet.children].forEach(b=>b.classList.remove('popped')); }
    for(let i=0;i<36;i++){ const b=document.createElement('button'); b.type='button'; b.className='bubble'; b.setAttribute('aria-label','Bubble'); b.addEventListener('click',()=>{ if(b.classList.contains('popped'))return; b.classList.add('popped'); popped++; noise(.018,.045); blip(125+Math.random()*50,.035,.028,'triangle'); vibrate(7); if(popped===36)setTimeout(resetBubbles,420); }); bubbleSheet.appendChild(b); }

    const stressBall=document.querySelector('#stressBall'),ballZone=document.querySelector('#ballZone');
    const squeeze=()=>{ stressBall.classList.add('squeeze'); ballZone.classList.add('squeezing'); blip(92,.12,.045,'sine'); vibrate(18); };
    const release=()=>{ stressBall.classList.remove('squeeze'); ballZone.classList.remove('squeezing'); };
    stressBall.addEventListener('pointerdown',e=>{ e.preventDefault(); stressBall.setPointerCapture?.(e.pointerId); squeeze(); }); stressBall.addEventListener('pointerup',release); stressBall.addEventListener('pointercancel',release);

    const spinner=document.querySelector('#spinner'),spinnerZone=document.querySelector('#spinnerZone'); let angle=0,velocity=0,lastX=0,lastT=0,raf=0;
    function spinLoop(){ angle+=velocity; velocity*=.985; spinner.style.transform=`rotate(${angle}deg)`; if(Math.abs(velocity)>.02){ if(Math.abs(velocity)>2 && Math.random()<.08) blip(80+Math.min(120,Math.abs(velocity)*5),.018,.008,'sine'); raf=requestAnimationFrame(spinLoop); } else raf=0; }
    spinnerZone.addEventListener('pointerdown',e=>{ e.preventDefault(); lastX=e.clientX; lastT=performance.now(); spinnerZone.setPointerCapture?.(e.pointerId); if(raf){cancelAnimationFrame(raf);raf=0;} });
    spinnerZone.addEventListener('pointermove',e=>{ if(!spinnerZone.hasPointerCapture?.(e.pointerId))return; const now=performance.now(),dx=e.clientX-lastX,dt=Math.max(1,now-lastT); angle+=dx*.7; velocity=dx/dt*22; spinner.style.transform=`rotate(${angle}deg)`; lastX=e.clientX; lastT=now; });
    spinnerZone.addEventListener('pointerup',()=>{ velocity=Math.max(-18,Math.min(18,velocity)); if(!raf)raf=requestAnimationFrame(spinLoop); vibrate(10); });

    const keyboard=document.querySelector('#keyboard');
    const rows=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','↵'],['⇧','Z','X','C','V','B','N','M','⌫'],['CTRL','ALT','SPACE','FN']];
    rows.forEach((labels,ri)=>{ const row=document.createElement('div'); row.className='key-row'; labels.forEach(label=>{ const k=document.createElement('button'); k.type='button'; k.className='key'; if(ri===2&&(label==='⇧'||label==='⌫'))k.classList.add('wide'); if(label==='SPACE')k.classList.add('space'); if(ri===3&&label!=='SPACE')k.classList.add('wide'); k.textContent=label; const wide=label==='SPACE'||label==='↵'||label==='⇧'||label==='⌫'; k.addEventListener('pointerdown',e=>{ e.preventDefault(); k.classList.add('down'); mechanical(wide); vibrate(wide?9:6); }); ['pointerup','pointercancel','pointerleave'].forEach(ev=>k.addEventListener(ev,()=>k.classList.remove('down'))); row.appendChild(k); }); keyboard.appendChild(row); });

    // iOS Safari gesture guards: keep app interactions, kill browser zoom/select gestures.
    ['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
    document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<=320)e.preventDefault(); lastTouchEnd=now; },{passive:false});
    document.addEventListener('contextmenu',e=>e.preventDefault());
  </script>
</body>
</html>
