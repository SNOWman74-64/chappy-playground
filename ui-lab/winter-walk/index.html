<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冬のさんぽ — UI Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4edf4;color:#344d60;font-family:system-ui,sans-serif}main{height:100svh;min-height:420px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}header{position:absolute;top:clamp(24px,6vh,60px);left:clamp(24px,6vw,80px);pointer-events:none}header p{font-size:10px;letter-spacing:.3em;margin:0 0 12px}h1{font-family:serif;font-weight:400;font-size:clamp(28px,4vw,44px);letter-spacing:.16em;margin:0}footer{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;padding:0 16px}button,select,a{font:inherit;color:inherit}button,select{min-height:44px;background:#ffffffd9;border:1px solid #b7c9d4;border-radius:24px;padding:10px 20px}button{cursor:pointer}a{font-size:12px;text-underline-offset:4px;padding:12px} :focus-visible{outline:3px solid #476f92;outline-offset:4px}#status{position:absolute;top:48%;width:100%;text-align:center;font-size:14px}
</style>
<main><canvas aria-label="雪の森を右へ歩く女の子。背景は左へ流れます。" role="img"></canvas><header><p>A LITTLE WINTER WALK</p><h1>冬のさんぽ</h1></header><p id="status" role="status">冬の景色を準備しています…</p><footer><button id="play" disabled>一時停止</button><select id="speed" aria-label="歩く速さ"><option value="0.65">ゆっくり</option><option value="1" selected>ふつう</option><option value="1.4">はやめ</option></select><a href="assets/walking.gif" download>GIFを保存</a></footer></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),speed=document.querySelector('#speed'),status=document.querySelector('#status');
let w=0,h=0,time=0,last=0,ready=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const frames=[];
function resize(){w=canvas.clientWidth;h=canvas.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function tree(x,y,s,color){ctx.fillStyle=color;ctx.fillRect(x-s*.025,y-s*.7,s*.05,s*.7);for(let j=0;j<4;j++){const yy=y-s+j*s*.18,half=s*(.14+j*.04);ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-half,yy+s*.39);ctx.quadraticCurveTo(x,yy+s*.33,x+half,yy+s*.39);ctx.closePath();ctx.fill()}}
function draw(){if(!w)return;const ground=h*.78;let g=ctx.createLinearGradient(0,0,0,ground);g.addColorStop(0,'#d3e2ee');g.addColorStop(1,'#f4f6fa');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff9e7';ctx.beginPath();ctx.arc(w*.77,h*.22,32,0,Math.PI*2);ctx.fill();
for(let layer=0;layer<2;layer++){ctx.fillStyle=['#ccd7e5','#dce3ed'][layer];ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=w+10;x+=10)ctx.lineTo(x,h*(.48+layer*.06)+Math.sin((x+time*6)/(150+layer*70))*40+Math.sin((x+time*6)/73)*12);ctx.lineTo(w,ground);ctx.fill()}
for(let layer=0;layer<3;layer++){const spacing=[130,190,290][layer],v=[12,28,65][layer],base=h*[.65,.72,.79][layer];for(let i=-1;i<w/spacing+2;i++){const x=i*spacing-((time*v)%spacing);tree(x,base,(80+layer*65)*(1+.12*Math.sin(i*7)),['#c0d0da','#a1b8c4','#7f9eaa'][layer])}}
g=ctx.createLinearGradient(0,ground-24,0,h);g.addColorStop(0,'#edf3f8');g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,ground-12);ctx.quadraticCurveTo(w*.5,ground-35,w,ground-8);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
ctx.fillStyle='#d5e0eb';for(let i=-1;i<w/95+2;i++){const x=i*95-(time*105%95);ctx.beginPath();ctx.ellipse(x,ground+18+Math.sin(i*9)*9,12,2,-.15,0,Math.PI*2);ctx.fill()}
if(ready){const fh=Math.min(h*.56,w*.92,410),fw=fh*320/410,x=w*.5-fw*.5,y=ground-fh+8;ctx.fillStyle='#b3c6d440';ctx.beginPath();ctx.ellipse(w*.5+12,ground+7,fw*.28,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(frames[Math.floor(time/.11)%8],x,y,fw,fh)}
ctx.fillStyle='#ffffffb3';for(let i=0;i<48;i++){const x=((i*137.3-time*18)%(w+30)+w+30)%(w+30)-15,y=(i*91.7+time*(12+i%7))%h;ctx.beginPath();ctx.arc(x,y,1+i%3*.5,0,Math.PI*2);ctx.fill()}}
function tick(now){if(last&&!paused&&ready)time+=Math.min((now-last)/1000,.05)*Number(speed.value);last=now;draw();requestAnimationFrame(tick)}
function label(){play.textContent=paused?'散歩を再開':'一時停止';play.setAttribute('aria-pressed',String(paused))}play.onclick=()=>{paused=!paused;label()};
const source=new Image();source.onload=()=>{try{for(let i=0;i<8;i++){const c=document.createElement('canvas');c.width=320;c.height=410;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(source,(i%4)*320,Math.floor(i/4)*410,320,410,0,0,320,410);const im=cx.getImageData(0,0,320,410),p=im.data,seen=new Uint8Array(320*410),queue=[];function add(n){if(n<0||n>=seen.length||seen[n])return;seen[n]=1;const k=n*4;if(Math.min(p[k],p[k+1],p[k+2])>232){queue.push(n);p[k+3]=0}}for(let x=0;x<320;x++){add(x);add(409*320+x)}for(let y=0;y<410;y++){add(y*320);add(y*320+319)}for(let q=0;q<queue.length;q++){const n=queue[q];if(n%320)add(n-1);if(n%320<319)add(n+1);add(n-320);add(n+320)}const visited=new Uint8Array(seen.length);for(let start=0;start<visited.length;start++){if(visited[start]||!p[start*4+3])continue;const part=[start];visited[start]=1;let edge=false;for(let j=0;j<part.length;j++){const n=part[j],x=n%320;if(x===0||x===319)edge=true;for(const next of [x?n-1:-1,x<319?n+1:-1,n-320,n+320])if(next>=0&&next<visited.length&&!visited[next]&&p[next*4+3]){visited[next]=1;part.push(next)}}if(edge&&part.length<2000)for(const n of part)p[n*4+3]=0}cx.putImageData(im,0,0);frames.push(c)}ready=true;status.hidden=true;play.disabled=false;label()}catch(e){status.textContent='画像を読み込めませんでした。ページを再読み込みしてください。';console.error(e)}};source.onerror=()=>status.textContent='画像を読み込めませんでした。ページを再読み込みしてください。';source.src='assets/walker.jpg';new ResizeObserver(resize).observe(canvas);requestAnimationFrame(tick);
</script></html>
