<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ed" />
  <title>Mock Gallery — Chappy Playground</title>
  <style>
    :root{
      --bg:#f3f1ed;--panel:#fbfaf7;--ink:#181817;--muted:#77736d;--line:#d8d4cd;--accent:#ff6f1e;
      --radius:18px;--content:1180px;--gap:18px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit}
    .shell{width:min(var(--content),calc(100% - 32px));margin:0 auto;padding:32px 0 64px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:34px}
    .eyebrow{display:block;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,7vw,78px);line-height:.9;letter-spacing:-.065em}
    .lead{max-width:620px;margin:16px 0 0;color:#59554f;font-size:14px;line-height:1.7}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.5);text-decoration:none;font-size:12px;font-weight:700}
    .button:hover{border-color:#aaa49b}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:var(--gap)}
    .section-head strong{font-size:13px}.section-head span{color:var(--muted);font-size:11px}

    /* Replaceable layout shell: catalog/data contract is intentionally independent from this grid. */
    .gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
    .mock-card{min-width:0;border-top:1px solid #292724;padding-top:12px}
    .thumb-link{display:block;text-decoration:none}
    .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#e7e3dc;border:1px solid var(--line);border-radius:var(--radius)}
    .thumb iframe,.thumb img{width:100%;height:100%;border:0;display:block;object-fit:cover;background:white;pointer-events:none}
    .thumb::after{content:"OPEN STUDY ↗";position:absolute;right:10px;bottom:10px;padding:7px 9px;background:rgba(24,24,23,.86);color:white;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.08em;opacity:0;transform:translateY(3px);transition:.15s ease}
    .thumb-link:hover .thumb::after{opacity:1;transform:none}
    .meta{padding:14px 2px 8px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.tag{font-size:9px;font-weight:800;letter-spacing:.08em;color:#706b64}
    .mock-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 7px;font-size:21px;letter-spacing:-.035em}.mock-title a{text-decoration:none}.mock-title a:hover{text-decoration:underline;text-underline-offset:4px}
    .summary{margin:0;color:#66615a;font-size:12px;line-height:1.65}
    .principles{margin:13px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
    .principles li{display:grid;grid-template-columns:18px 1fr;gap:4px;padding:7px 0;border-bottom:1px solid rgba(216,212,205,.7);font-size:10px;color:#5b5751}.principles li::before{content:"→";color:var(--accent)}
    .empty{padding:30px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:13px}
    .foot{display:flex;justify-content:space-between;gap:20px;margin-top:48px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
    @media(max-width:760px){.shell{width:min(100% - 24px,var(--content));padding-top:22px}.topbar{display:block}.top-actions{justify-content:flex-start;margin-top:20px}.gallery-grid{grid-template-columns:1fr}.thumb{aspect-ratio:1.35/1}h1{font-size:58px}.lead{font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">Chappy Playground / UI Lab</span>
        <h1>mock gallery</h1>
        <p class="lead">見た目だけでなく、参考元から抽出したデザイン構成・設計思想・反省点・修正知見まで一緒に残すための実験カタログ。今はレイアウトより、追加しやすいガワを優先。</p>
      </div>
      <nav class="top-actions" aria-label="gallery links">
        <a class="button" href="../">← Playground</a>
        <a class="button" href="./viewer.html?id=daybook-cardless&tab=design">Shared harness ↗</a>
      </nav>
    </header>

    <div class="section-head"><strong>STUDIES</strong><span id="count">loading…</span></div>
    <section class="gallery-grid" id="gallery" aria-live="polite"></section>
    <footer class="foot"><span>catalog.json driven</span><span>layout shell can be replaced later</span></footer>
  </main>

  <script>
    const gallery=document.querySelector('#gallery');
    const count=document.querySelector('#count');
    const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function media(mock){
      if(mock.thumbnail) return `<img src="${esc(mock.thumbnail)}" alt="${esc(mock.title)} thumbnail">`;
      return `<iframe loading="lazy" tabindex="-1" aria-hidden="true" src="${esc(mock.previewPath)}?gallery-preview=1"></iframe>`;
    }

    function card(mock){
      const tags=(mock.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
      const principles=(mock.principles||[]).slice(0,3).map(p=>`<li>${esc(p)}</li>`).join('');
      const detail=`./viewer.html?id=${encodeURIComponent(mock.id)}`;
      return `<article class="mock-card">
        <a class="thumb-link" href="${detail}" aria-label="Open ${esc(mock.title)} study"><div class="thumb">${media(mock)}</div></a>
        <div class="meta">
          <div class="tags">${tags}</div>
          <h2 class="mock-title"><a href="${detail}">${esc(mock.shortTitle||mock.title)}</a><span>↗</span></h2>
          <p class="summary">${esc(mock.summary)}</p>
          <ul class="principles">${principles}</ul>
        </div>
      </article>`;
    }

    fetch('./catalog.json',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('catalog load failed');return r.json()})
      .then(data=>{
        const mocks=data.mocks||[];
        count.textContent=`${mocks.length} studies`;
        gallery.innerHTML=mocks.length?mocks.map(card).join(''):'<div class="empty">まだモックがありません。</div>';
      })
      .catch(err=>{count.textContent='error';gallery.innerHTML=`<div class="empty">catalog.json を読み込めませんでした。<br>${esc(err.message)}</div>`});
  </script>
</body>
</html>
